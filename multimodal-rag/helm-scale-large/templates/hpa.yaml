{{- if .Values.autoscaling.enabled }}
# HorizontalPodAutoscaler for the API Deployment (opt-in: autoscaling.enabled).
# ONLY the API Deployment autoscales: the Qdrant StatefulSet (shard topology +
# per-replica PVCs) and the embed-batcher singleton (replicas must stay 1)
# are deliberately excluded, and the base chart has no autoscaling at all
# (its in-process unlock cache is not multi-replica safe).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Values.deployment.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.deployment.appName }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Values.deployment.name }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
  {{- with .Values.autoscaling.behavior }}
  behavior:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}

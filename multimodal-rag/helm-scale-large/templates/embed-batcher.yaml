apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.deployment.name }}-embed-batcher
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.deployment.name }}-embed-batcher
spec:
  # MUST stay at 1: this is a singleton aggregator.  More replicas would
  # split the batch pool again and defeat the entire purpose.
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.deployment.name }}-embed-batcher
  template:
    metadata:
      # EzUA app-catalog labels on the POD TEMPLATE: the catalog derives a
      # card's status from labeled pods — an app whose pods carry no
      # hpe-ezua labels shows "Unknown" in the catalog (this chart was the
      # only unlabeled-pod app on G2 and the only Unknown card, 2026-10).
      # Long-running controllers only: cron-job pods stay UNLABELED — the
      # platform's assign-custom-scheduler-for-ezua-user-vendor-pods policy
      # stamps schedulerName on labeled pods at EVERY admission, and pod
      # updates (Job finalizer removal) then reject the immutable-field
      # change — the G2 2026-09-24 undeletable-cron-pod incident (see
      # tests/full_pipeline/test_kyverno_vendor_labels_render.py).
      labels:
        app: {{ .Values.deployment.name }}-embed-batcher
        hpe-ezua/type: vendor-service
        hpe-ezua/app: {{ .Chart.Name }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: embed-batcher
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          command: ["python", "-m", "multimodal_rag.embed_batcher"]
          args: ["--host", "0.0.0.0", "--port", {{ .Values.embedBatcher.port | quote }}]
          envFrom:
            - configMapRef:
                name: {{ .Values.deployment.name }}-config
            - secretRef:
                name: {{ .Values.deployment.name }}-model-keys
          env:
            - name: RAG_REMOTE
              value: {{ .Values.rag.remote | quote }}
            - name: CONFIG_DIR
              value: "/etc/rag/config:/etc/rag/secrets"
            # Never route to ourselves (would recurse).
            - name: RAG_EMBED_BATCH_URL
              value: ""
            {{- range $key, $val := .Values.extraEnv }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
          ports:
            - containerPort: {{ .Values.embedBatcher.port }}
              name: http
          volumeMounts:
            - name: rag-config
              mountPath: /etc/rag/config
              readOnly: true
            - name: rag-model-keys
              mountPath: /etc/rag/secrets
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources: {{ toYaml .Values.resources.embedBatcher | nindent 12 }}
          startupProbe:
            httpGet:
              path: /readyz
              port: {{ .Values.embedBatcher.port }}
            failureThreshold: 30
            periodSeconds: 5
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: {{ .Values.embedBatcher.port }}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.embedBatcher.port }}
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
      volumes:
        - name: rag-config
          configMap:
            name: {{ .Values.deployment.name }}-config
        - name: rag-model-keys
          secret:
            secretName: {{ .Values.deployment.name }}-model-keys
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.deployment.name }}-embed-batcher
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.deployment.name }}-embed-batcher
    # EZUA app-catalog discovery requires the vendor labels on every
    # Service — an unlabeled Service flips the imported app's card to
    # "Unknown" (the embed-batcher Service was the one unlabeled resource).
    hpe-ezua/app: {{ .Chart.Name }}
    hpe-ezua/type: vendor-service
spec:
  type: ClusterIP
  selector:
    app: {{ .Values.deployment.name }}-embed-batcher
  ports:
    - name: http
      port: {{ .Values.embedBatcher.port }}
      targetPort: {{ .Values.embedBatcher.port }}
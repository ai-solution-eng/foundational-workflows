apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.deployment.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.deployment.appName }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.deployment.appName }}
  template:
    metadata:
      labels:
        app: {{ .Values.deployment.appName }}
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        - name: fix-pvc-permissions
          image: busybox:latest
          securityContext:
            runAsUser: 0
          command: ["sh", "-c", "chown -R 1000:1000 /data"]
          volumeMounts:
            - name: data
              mountPath: /data
      {{- if .Values.antiAffinity.enabled }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - {{ .Values.deployment.appName }}
                topologyKey: kubernetes.io/hostname
      {{- end }}
      containers:
        - name: rag-api-server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - gunicorn
            - -k
            - uvicorn.workers.UvicornWorker
            - -w
            - {{ .Values.app.workers | quote }}
            - --bind
            - "0.0.0.0:8000"
            - --timeout
            - "300"
            - multimodal_rag.api_server:app
          envFrom:
            - configMapRef:
                name: {{ .Values.deployment.name }}-config
            - secretRef:
                name: {{ .Values.deployment.name }}-model-keys
          env:
            - name: RAG_REMOTE
              value: {{ .Values.rag.remote | quote }}
            - name: DATA_PATH
              value: "/data"
            - name: QDRANT_HOST
              value: {{ .Values.deployment.name }}-qdrant
            - name: QDRANT_PORT
              value: {{ .Values.qdrant.httpPort | quote }}
            - name: QDRANT_STORAGE_PATH
              {{- if .Values.persistence.qdrant.mountReadOnly }}
              value: "/qdrant-storage"
              {{- else }}
              value: ""
              {{- end }}
            {{- range $key, $val := .Values.extraEnv }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
          ports:
            - containerPort: 8000
              name: http
          volumeMounts:
            - name: data
              mountPath: /data
            {{- if .Values.persistence.qdrant.mountReadOnly }}
            - name: qdrant-data
              mountPath: /qdrant-storage
              readOnly: true
            {{- end }}
          resources: {{ toYaml .Values.resources.app | nindent 12 }}
          startupProbe:
            httpGet:
              path: /healthz
              port: 8000
            failureThreshold: 30
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 0
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

        {{- if .Values.mcp.enabled }}
        - name: rag-mcp-server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - python
            - -m
            - multimodal_rag.mcp_server
          args:
            - --transport
            - streamable-http
            - --host
            - "0.0.0.0"
            - --port
            - {{ .Values.mcp.port | quote }}
            - --data-path
            - "/data"
            - --qdrant-host
            - {{ .Values.deployment.name }}-qdrant
            - --qdrant-port
            - {{ .Values.qdrant.httpPort | quote }}
          envFrom:
            - configMapRef:
                name: {{ .Values.deployment.name }}-config
            - secretRef:
                name: {{ .Values.deployment.name }}-model-keys
          env:
            - name: RAG_REMOTE
              value: {{ .Values.rag.remote | quote }}
            - name: DATA_PATH
              value: "/data"
            - name: QDRANT_HOST
              value: {{ .Values.deployment.name }}-qdrant
            - name: QDRANT_PORT
              value: {{ .Values.qdrant.httpPort | quote }}
            - name: QDRANT_STORAGE_PATH
              {{- if .Values.persistence.qdrant.mountReadOnly }}
              value: "/qdrant-storage"
              {{- else }}
              value: ""
              {{- end }}
            {{- range $key, $val := .Values.extraEnv }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
          ports:
            - containerPort: {{ .Values.mcp.port }}
              name: mcp
          volumeMounts:
            - name: data
              mountPath: /data
            {{- if .Values.persistence.qdrant.mountReadOnly }}
            - name: qdrant-data
              mountPath: /qdrant-storage
              readOnly: true
            {{- end }}
          resources: {{ toYaml .Values.resources.app | nindent 12 }}
          startupProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.mcp.port }}
            failureThreshold: 60
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.mcp.port }}
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.mcp.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
        {{- end }}

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.deployment.name }}-data
        {{- if .Values.persistence.qdrant.mountReadOnly }}
        - name: qdrant-data
          persistentVolumeClaim:
            claimName: data-{{ .Values.deployment.name }}-qdrant-0
        {{- end }}

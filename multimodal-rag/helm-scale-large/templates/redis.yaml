{{- if .Values.redis.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.deployment.name }}-redis
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.deployment.name }}-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.deployment.name }}-redis
  template:
    metadata:
      # EzUA app-catalog labels on the POD TEMPLATE: the catalog derives a
      # card's status from labeled pods — an app whose pods carry no
      # hpe-ezua labels shows "Unknown" in the catalog (this chart was the
      # only unlabeled-pod app on G2 and the only Unknown card, 2026-10).
      # Long-running controllers only: cron-job pods stay UNLABELED — the
      # platform's assign-custom-scheduler-for-ezua-user-vendor-pods policy
      # stamps schedulerName on labeled pods at EVERY admission, and pod
      # updates (Job finalizer removal) then reject the immutable-field
      # change — the G2 2026-09-24 undeletable-cron-pod incident (see
      # tests/full_pipeline/test_kyverno_vendor_labels_render.py).
      labels:
        app: {{ .Values.deployment.name }}-redis
        hpe-ezua/type: vendor-service
        hpe-ezua/app: {{ .Chart.Name }}
    spec:
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: redis
          image: "{{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}"
          imagePullPolicy: {{ .Values.redis.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          command:
            - sh
            - -c
            - |
              {{- /* In user-secret mode the gate is ON unconditionally: the
                     password (if any) arrives via the envFrom chain below —
                     user Secret > stored chart value > values seed; empty
                     everywhere still means --requirepass "" (auth off, the
                     documented fallback). */ -}}
              {{- if or .Values.redis.password .Values.modelSecrets.existingSecret }}
              exec redis-server --save "" --appendonly no --requirepass "$REDIS_PASSWORD"
              {{- else }}
              exec redis-server --save "" --appendonly no
              {{- end }}
          {{- if .Values.modelSecrets.existingSecret }}
          # Per-key envFrom merge (later source wins): an explicit env
          # secretKeyRef here would SHADOW the user Secret's REDIS_PASSWORD
          # and desync the server from the API containers' client password.
          envFrom:
            - secretRef:
                name: {{ .Values.deployment.name }}-model-keys
            - secretRef:
                name: {{ .Values.modelSecrets.existingSecret }}
          {{- else }}
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.deployment.name }}-model-keys
                  key: REDIS_PASSWORD
          {{- end }}
          ports:
            - containerPort: {{ .Values.redis.port }}
              name: redis
          resources: {{ toYaml .Values.resources.redis | nindent 12 }}
          livenessProbe:
            tcpSocket:
              port: {{ .Values.redis.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["sh", "-c", "redis-cli --no-auth-warning ${REDIS_PASSWORD:+-a \"$REDIS_PASSWORD\"} ping"]
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.deployment.name }}-redis
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.deployment.name }}-redis
spec:
  type: ClusterIP
  ports:
    - name: redis
      port: {{ .Values.redis.port }}
      targetPort: {{ .Values.redis.port }}
  selector:
    app: {{ .Values.deployment.name }}-redis
{{- end }}

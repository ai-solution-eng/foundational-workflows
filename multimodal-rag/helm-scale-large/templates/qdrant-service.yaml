apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.deployment.name }}-qdrant
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.deployment.name }}-qdrant
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: grpc
      port: {{ .Values.qdrant.grpcPort }}
      targetPort: {{ .Values.qdrant.grpcPort }}
    - name: http
      port: {{ .Values.qdrant.httpPort }}
      targetPort: {{ .Values.qdrant.httpPort }}
    - name: p2p
      port: 6335
      targetPort: 6335
  selector:
    app: {{ .Values.deployment.name }}-qdrant

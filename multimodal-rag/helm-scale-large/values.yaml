# ============================================================================
# Multimodal RAG — helm-scale-large/ chart values (rag-mcp-scale-large: 4 API
# replicas x 4 workers, 3-shard Qdrant, shared embed-batcher singleton).
# Chart defaults: every key the chart reads, with the default it ships. Site
# values files override this one.
# Full guide: documentation/DEPLOYMENT.md + documentation/SCALE.md.
# Owner: Andrew Bydlon
# Email: andrew.bydlon@hpe.com
# ============================================================================

# ### REQUIRED ### — key material lives in Secrets you own, NOT in values
# (build from helm/local/secrets.template.yaml; missing Secret = pods refuse
# to start).
#   1. modelSecrets.existingSecret — the broad secret: MODEL_*_API_KEY per
#      enabled role, optionally MODEL_*_URL / S3_* / REDIS_PASSWORD.
#   2. models.embedder.url — reachable embedder endpoint (startup ABORTS if
#      unreachable) unless the Secret carries MODEL_EMBEDDER_URL.
#   3. security.existingSecret — RAG_API_KEY + MEDIA_TOKEN_SECRET. Rotation
#      runbook: helm/ROTATION.md.
#   4. ezua.virtualService.endpoint — RENDER FAILS without it while ezua.enabled.

# ### OPTIONAL ###
# Major tuning setups (copy the shape from the pointer):
#   Scaling: autoscaling.* (HPA; minReplicas = the HA floor) / antiAffinity / qdrant.replicas — SCALE.md §12
#   Embed-batcher (shared singleton): embedBatcher.* — SCALE.md
#   SSO / identity stack, ORDERED: security.oidc.* / oidc.sso.* / ssoGate / accessSelfMint / trustProxyIdentity — DEPLOYMENT.md §5b
#   Multi-user keys + access store: mcp.apiKeyClients / mcp.datasetAcls / security.accessStore — DEPLOYMENT.md §2
#   MCP API-key gate: mcp.apiKey.existingSecret (pre-create the Secret) — §2 + §5b
#   Metrics: metrics.serviceMonitor (+ bearer Secret when security.metricsAuth) — §2
#   Storage: s3.* / backups.* / watchedSources.* (each source REQUIRES dataset + >=1 prefix) — §2 + §7b
#   Optional model roles: models.reranker / vlm / asr (url "" disables) — §2
#   RAG pipeline: rag.ocr / rag.contextual / rag.rrfDefault — §2

# ============================================================================
# Image / Scaling
# ============================================================================

deployment:
  name: rag-mcp-server
  appName: rag-mcp-server

# HPA owns the API Deployment's replicas (`replicaCount` goes inert); needs
# metrics-server. minReplicas is the HA floor.
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70
  # Stabilization window so bursty RAG traffic does not flap scale-down.
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300

replicaCount: 4

image:
  repository: ghcr.io/ai-solution-eng/multimodal-rag-mcp
  tag: v5.9.5
  pullPolicy: IfNotPresent

qdrant:
  # Startup-probe budget for a qdrant node: failureThreshold x periodSeconds(5).
  # 240 x 5s = 20 min. A cold join replays the raft log over NFS and can far
  # exceed the old 150s (30 x 5s), which killed the pod mid-catch-up
  # (2026-10-17 incident). Raise for very large collections.
  startupProbeFailureThreshold: 240
  replicas: 3
  image:
    repository: qdrant/qdrant
    tag: v1.19.2
    pullPolicy: IfNotPresent
  grpcPort: 6334
  httpPort: 6333

  client:
    preferGrpc: true
    timeout: 30
    quantization: int8
    quantizationAlwaysRam: true
  telemetryDisabled: true

redis:
  enabled: true
  image:
    repository: redis
    tag: 7-alpine
    pullPolicy: IfNotPresent
  port: 6379
  password: ''

embedBatcher:
  enabled: true
  port: 8002

# ============================================================================
# Resources
# ============================================================================

resources:
  app:
    # HPA-calibrated: 2 cpu puts the 70% target at ~1.4 cores; memory 4Gi is the eviction floor.
    requests: {cpu: 2, memory: 4Gi}
    limits: {cpu: 4, memory: 8Gi}

  qdrant:
    # Burst-to-limit (not the HPA signal); watch headroom near the limits.
    requests: {cpu: '1', memory: 4Gi}
    limits: {cpu: '8', memory: 32Gi}

  redis:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: 500m, memory: 512Mi}

  embedBatcher:
    requests: {cpu: 500m, memory: 512Mi}
    limits: {cpu: '2', memory: 1Gi}

persistence:
  data:
    size: 100Gi
    storageClass: gl4f-filesystem
    accessMode: ReadWriteMany

  qdrant:
    size: 100Gi
    storageClass: gl4f-filesystem
    accessMode: ReadWriteOnce
    mountReadOnly: false

# ============================================================================
# App Parallelism
# ============================================================================

app:
  workers: 4
  syncPoolSize: 64
  mcpPoolSize: 64
  embeddingQueryBatchSize: 128
  embeddingQueryBatchWaitMs: 200
  embeddingQueryIdleWaitMs: 50
  embeddingMaxImagesPerPrompt: 4
  qdrantQueryBatchSize: 128
  qdrantQueryBatchWaitMs: 5
  qdrantPoolSize: 16

modelPool:
  maxConnections: 200
  maxKeepaliveConnections: 50

# ============================================================================
# Secrets
# ============================================================================

models:
  embedder:
    name: RamManavalan/Qwen3-VL-Embedding-8B-FP8
    url: ''
    className: MultiModalEmbeddings
    extra:
      embedding_dim: 4096
      chunk_size: 2048
      chunk_overlap: 256
      code_chunk_size: 8192
      code_chunk_overlap: 512
      tokenizer_name: Qwen/Qwen3-VL-Embedding-8B
      tokenizer_type: HuggingFace
      # Fingerprint-guard alias: datasets indexed under the old id survive the FP8 swap.
      alias: Qwen/Qwen3-VL-Embedding-8B

  reranker:
    name: Qwen/Qwen3-VL-Reranker-8B
    url: ''
    className: MultiModalReranker
    extra: {}

  vlm:
    name: Qwen/Qwen3.8-27B-FP8
    url: ''
    extra: {}

  asr:
    name: CohereLabs/cohere-transcribe-03-2026
    url: ''
    extra: {}

# SECRET-FIRST + STICKY: the Secret wins on every upgrade — these entries only
# seed it (reseed = delete the Secret, then upgrade). MODEL_*_URL is sticky too.
modelSecrets:
  # Broad secret you own: MODEL_*_API_KEY (+ optional MODEL_*_URL, S3_*, REDIS_PASSWORD) — every key it carries overrides the seeds.
  existingSecret: ''
  embedderApiKey: ''
  rerankerApiKey: ''
  vlmApiKey: ''
  asrApiKey: ''

# ============================================================================
# App Defaults
# ============================================================================

rag:
  ocr: false
  captionWithAsr: true
  captionWithVlm: true
  remote: false
  dedupThreshold: 0.995
  deferCountSync: true
  # Ingest-time contextual retrieval: true = NEW datasets stamp contextual:true
  # (an explicit body "contextual" always wins); cost = one LLM call per text chunk.
  contextual: false
  # When enabled, NEW datasets stamp dense/sparse[/k] (a body "rrf" object always wins).
  rrfDefault:
    enabled: false
    dense: 1.0
    sparse: 1.0
    k: 2
  # Caps explicit unlock TTLs (60..N s); 0 = the /access "No expiry (0)" option becomes meaningful.
  unlockMaxTtl: 86400

mcp:
  enabled: true
  port: 9090
  apiKey:
    existingSecret: ""
    existingSecretKey: api-keys
  # (OPT-IN) per-user keys + dataset ACLs; both empty = single-key behaviour.
  # Syntax: "alice:key-a;bob:key-b" / "alice:reports,notes;bob:*"; ':ro' = read-only.
  apiKeyClients: ""
  datasetAcls: ""

antiAffinity:
  enabled: true

# Extra env vars for BOTH containers — pass-through for env-only knobs:
# MEMORY_DATASET, RAG_MEMORY_PASSWORD, INGEST_ALLOW_S3_BUCKETS, HTTPS_PROXY, etc.
#
# PERFORMANCE KNOBS live here too, by design: ~31 ingest/serve tuning envs
# (RAG_INGEST_CONCURRENCY, RAG_MAX_BODY_BYTES, STAGING_TTL, RAG_BM25_K,
# RAG_BM25_B, RAG_BM25_FLUSH_CALLS, RAG_BM25_FLUSH_SECONDS, RAG_CACHE_MAX, ...)
# are deliberately NOT plumbed as values keys — they are settable ONLY via
# extraEnv. Scope decision 2026-10-16 (audit P2).
extraEnv: {}

# ============================================================================
# Security
# ============================================================================

security:
  # REST API key + media-token HMAC secret — sourcing order: existingSecret >
  # inline > stored release value > auto-generated. Rotation: helm/ROTATION.md.
  apiKey: ''
  mediaTokenSecret: ''
  # Optional Secret you manage providing both keys (chart then renders neither).
  existingSecret: ''
  existingSecretApiKey: RAG_API_KEY
  existingSecretMediaTokenKey: MEDIA_TOKEN_SECRET
  mediaTokenTtl: 3600
  ingestAllowHosts: ''
  blockPrivateHosts: true
  maxDownloadBytes: 536870912
  archiveMaxTotalBytes: 2147483648
  archiveMaxMemberBytes: 1073741824
  archiveMaxEntries: 10000
  mediaAllowPathPrefixes: /data/datasets:/data/staging
  pwMaxFailures: 10
  pwFailWindow: 300
  # D24 proxy-identity trust: accept X-Auth-Request-*/X-Email/X-User headers as
  # an identity credential. DEFAULT FALSE (P0-1 remediation 2026-10-16): these
  # headers are attacker-settable on any direct call that bypasses the gateway
  # AuthorizationPolicy. Set true ONLY for deployments whose EVERY network path
  # to the app traverses an enforcing oauth2-proxy (pair with
  # networkPolicy.enabled so ClusterIP callers cannot impersonate).
  trustProxyIdentity: false
  # P0-1 positive assertion (Zone A, 2026-10-16): when set, the app requires
  # every proxy-identity request to carry X-Enforcing-Proxy == THIS value
  # (constant-time compare) — proof that an enforcing proxy fronts the app.
  # The operator MUST wire the ingress/gateway to inject the header on EVERY
  # request (oauth2-proxy --custom-headers / Istio AuthorizationPolicy header
  # injection); an unwired proxy simply loses the proxy-identity feature
  # (fail closed — the app never trusts a bare spoofable name).
  # DEFAULT EMPTY = disabled: the D21 forwarded-OIDC-token assertion is the
  # only accepted proof instead. This value is proof material — prefer a
  # Secret pipeline (modelSecrets.existingSecret style) over a committed
  # values file if your tooling allows it.
  enforcingProxySignal: ''
  # Self-service dataset selection on /access (saved per identity); effective
  # access = operator ACL ∪ selections. Useful only with mcp.apiKeyClients.
  accessStore: true
  # Comma-separated datasets that can never be self-selected (read per request).
  accessDenySelect: ''
  # SSO self-mint (read per request): an SSO identity mints/rotates a key for its
  # OWN registry identity, carrying exactly its existing access. Inert without SSO.
  # DEFAULT FALSE (P0-1 remediation 2026-10-16): opt-in per deployment — the
  # default-ON posture let a spoofed proxy identity mint a durable key (P0-1
  # escalation chain). Requires oidc.enabled or trustProxyIdentity AND
  # accessStore to do anything at all.
  accessSelfMint: false
  # May ordinary users (SSO / named API keys) create datasets? Default true: a
  # dataset is owned by whoever created it and reaches nobody else until an
  # operator grants it. Set false for admin-only creation. A per-user override
  # on the /access page beats this default in either direction.
  datasetsCreateAllowed: true
  # Fallback memory dataset for callers with no personal ★ binding; empty = unset.
  memoryDefault: ''
  # Gate /metrics behind an API key; false (default) = public in-cluster exposition.
  metricsAuth: false
  # OIDC JWT as a SECOND credential for the same per-user registry identity
  # (join = identityClaim). JWT identities are never admin. Issuer REQUIRED when enabled.
  oidc:
    enabled: false
    issuer: ''
    audience: ua
    # Claim carrying the registry identity name (fallback: `sub`).
    identityClaim: preferred_username
    # Optional explicit JWKS URL; empty = <issuer>/protocol/openid-connect/certs.
    jwksUrl: ''
    jwksRefreshSeconds: 3600
    observedTtl: 86400
    fetchTimeoutSeconds: 3
    clockSkewSeconds: 60
    # Browser SSO (the Open WebUI pattern): /oauth/login → realm → callback plants
    # an HttpOnly session cookie resolving to the SAME registry identity.
    sso:
      enabled: false
      clientId: ua
      clientSecret: ''
      # Secret carrying the client secret (key clientSecretKey) — preferred.
      clientExistingSecret: ''
      clientExistingSecretKey: clientSecret
      # Callback URL registered in the client: https://<endpoint>/oauth/oidc/callback
      redirectUri: ''
      # In-cluster discovery URL (plain HTTP; the external issuer stays CLAIM-COMPARED only).
      providerUrl: ''
      scopes: 'openid profile email'
      cookieName: pcai-sso
      cookieMaxAgeSeconds: 43200
      cookieSecure: true
    # Platform private-CA bundle (PEM ConfigMap): OIDC fetches (JWKS + SSO code
    # exchange) trust it via REMOTE_CA_BUNDLE. Empty = not mounted.
    platformCa:
      configMapName: ''
      configMapKey: ca-certificates.crt
  # Identity gate on the served HTML pages (read per request): /, /manage and
  # /access require an identity. Meaningful only with oidc.enabled or API keys.
  ssoGate: false

metrics:
  serviceMonitor: false
  interval: 30s
  # With metricsAuth on: a Secret whose <key> holds a valid API key for the scraper.
  serviceMonitorBearerSecret: ''
  serviceMonitorBearerSecretKey: RAG_API_KEY

# ============================================================================
# S3 Related
# ============================================================================

s3:
  endpointUrl: http://minio.minio.svc.cluster.local:9000
  accessKeyId: ''
  secretAccessKey: ''

backups:
  enabled: false
  schedule: 0 3 * * *
  bucket: ''
  retentionDays: 0

# Short-term memory (STM): session-scoped, self-expiring datasets for agent
# swarms.  A dataset created with a lifetime, every entry stamped with a
# server-computed expires_at, and a CronJob that deletes EXPIRED POINTS.
# PHASE 1 ONLY: nothing in this feature deletes a DATASET — the reaper deletes
# expired POINTS only (the Phase-2 dataset-deletion gate was never implemented
# and its values key was removed 2026-10-16 — audit dead-key sweep).
# Seconds a cron tick waits for qdrant /readyz before failing the tick
# (2026-10-17 incident: a tick that touched a half-joined cluster
# panicked the raft leader).  1800 = 30 minutes.  The next tick
# retries; ticks never run concurrently (concurrencyPolicy: Forbid).
cronQdrantReadyTimeoutSeconds: 1800
shortTermMemory:
  enabled: false
  # Lifetime of a dataset created without an explicit ttl, in hours.
  defaultTtlHours: 6
  # Hard cap on a create-time ttl override; larger requests are refused.
  maxTtlHours: 24
  # Reaper schedule — UTC, like every other CronJob in this chart.
  reapSchedule: '*/15 * * * *'
  # REQUIRED when enabled: the per-deployment salt behind the minted dataset
  # names (stm-<base32(hmac_sha256(salt, session_id))[:16]>).  Treat it as key
  # material — supply it from a Secret pipeline, never from a committed values
  # file.  Unset => the create/end routes answer 503 (fail-loud, nothing is
  # minted) rather than minting guessable names.
  nameSalt: ''
  # (The former deleteDatasetsOnExpiry key was removed 2026-10-16: a Phase-2
  # gate nothing in the app reads — the reaper reaps POINTS and never a
  # dataset. Reintroduce the key only together with the app-side gate.)

# Watched S3 sources (opt-in reconciler CronJob): each tick POSTs every source's
# prefixes to batch-urls with sync=true. s3:// DIRECTORY URLs only; >=1 prefix.
watchedSources:
  enabled: false
  schedule: '*/30 * * * *'
  sources: []
  # Each source: dataset name + >=1 s3:// directory prefix.

# ============================================================================
# PCAI Networking
# ============================================================================

service:
  api:
    type: ClusterIP
    port: 80

  mcp:
    type: ClusterIP

ezua:
  enabled: true
  virtualService:
    # false unrenders the VirtualService (no browser path) while ezua.enabled
    # keeps driving every other gate (configmap MEDIA_BASE_URL included).
    enabled: true
    endpoint: rag-mcp-server.${DOMAIN_NAME}
    istioGateway: istio-system/ezaf-gateway
    timeout: 300s
    longTimeout: 3600s

  authorizationPolicy:
    enabled: true
    namespace: istio-system
    providerName: oauth2-proxy

# Ingress allowlist (kubernetes.io/metadata.name ns selectors): once enabled,
# anything unmatched is DENIED (egress unrestricted). Defaults OFF — the
# default render ships no NetworkPolicy (byte-identical to the baseline).
networkPolicy:
  enabled: false
  sameNamespace: true
  # Client namespaces allowed to call IN-CLUSTER. Add the Prometheus scrape ns —
  # an unlisted ServiceMonitor ns dies SILENTLY (check targets).
  authorizedClients:
    namespaces: []
  # The ezaf-gateway (browser) path stays ON so the VS routes keep working.
  allowEzafGatewayIngress: true
  ingressGatewayNamespace: istio-system
  # Edge pods carry app=istio-ingressgateway (ezaf-gateway is the Gateway CR
  # name, not a pod label) — do not "fix" this back.
  ingressGatewayLabels:
    app: istio-ingressgateway
  # Node-originated kubelet probes / port-forward.  NEVER 0.0.0.0/0 with an
  # empty probeExceptCidrs — the render FAILS on that combination (guard in
  # templates/networkpolicy.yaml).
  probeCidrs: []
  probeExceptCidrs: []

replicaCount: 4
image:
  repository: ghcr.io/ai-solution-eng/multimodal-rag-mcp
  tag: v3.6.3
  pullPolicy: IfNotPresent
deployment:
  name: rag-mcp-server
  appName: rag-mcp-server
app:
  workers: 4
  syncPoolSize: 64
  mcpPoolSize: 64
  embeddingQueryBatchSize: 128
  embeddingQueryBatchWaitMs: 200
  embeddingQueryIdleWaitMs: 50
  embeddingMaxImagesPerPrompt: 4
  qdrantQueryBatchSize: 128
  qdrantQueryBatchWaitMs: 5
  qdrantPoolSize: 16
persistence:
  data:
    size: 100Gi
    storageClass: gl4f-filesystem
    accessMode: ReadWriteMany
  qdrant:
    size: 100Gi
    storageClass: gl4f-filesystem
    accessMode: ReadWriteOnce
    mountReadOnly: false
models:
  embedder:
    name: Qwen/Qwen3-VL-Embedding-8B
    url: ''
    className: MultiModalEmbeddings
    extra:
      embedding_dim: 4096
      chunk_size: 2048
      chunk_overlap: 256
      code_chunk_size: 8192
      code_chunk_overlap: 512
      tokenizer_name: Qwen/Qwen3-VL-Embedding-8B
      tokenizer_type: HuggingFace
  reranker:
    name: Qwen/Qwen3-VL-Reranker-8B
    url: ''
    className: MultiModalReranker
    extra: {}
  vlm:
    name: Qwen/Qwen3.8-27B-FP8
    url: ''
    extra: {}
  asr:
    name: CohereLabs/cohere-transcribe-03-2026
    url: ''
    extra: {}
modelSecrets:
  embedderApiKey: ''
  rerankerApiKey: ''
  vlmApiKey: ''
  asrApiKey: ''
modelPool:
  maxConnections: 200
  maxKeepaliveConnections: 50
s3:
  endpointUrl: http://minio.minio.svc.cluster.local:9000
  accessKeyId: ''
  secretAccessKey: ''
rag:
  ocr: false
  captionWithAsr: true
  captionWithVlm: true
  remote: false
  dedupThreshold: 0.995
  deferCountSync: true
qdrant:
  replicas: 3
  image:
    repository: qdrant/qdrant
    tag: v1.19.0
    pullPolicy: IfNotPresent
  grpcPort: 6334
  httpPort: 6333
  client:
    preferGrpc: true
    timeout: 30
    quantization: int8
    quantizationAlwaysRam: true
  telemetryDisabled: true
redis:
  enabled: true
  image:
    repository: redis
    tag: 7-alpine
    pullPolicy: IfNotPresent
  port: 6379
  password: ''
mcp:
  enabled: true
  port: 9090
embedBatcher:
  enabled: true
  port: 8002
service:
  api:
    type: ClusterIP
    port: 80
  mcp:
    type: ClusterIP
resources:
  app:
    requests:
      memory: 4Gi
      cpu: 2
    limits:
      memory: 8Gi
      cpu: 4
  qdrant:
    requests:
      memory: 16Gi
      cpu: '4'
    limits:
      memory: 32Gi
      cpu: '8'
  redis:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 500m
  embedBatcher:
    requests:
      memory: 512Mi
      cpu: 500m
    limits:
      memory: 1Gi
      cpu: '2'
antiAffinity:
  enabled: true
extraEnv: {}
security:
  apiKey: Zst_qoSr9RcPRI0G44CxsdXbN2_02UnG
  mediaTokenSecret: 48b00cdf6d0979891ada5b3e51a5dd883ee752a5a1256b578c8271c30569944d
  mediaTokenTtl: 3600
  ingestAllowHosts: ''
  blockPrivateHosts: true
  maxDownloadBytes: 536870912
  archiveMaxTotalBytes: 2147483648
  archiveMaxMemberBytes: 1073741824
  archiveMaxEntries: 10000
  mediaAllowPathPrefixes: /data/datasets:/data/staging
  pwMaxFailures: 10
  pwFailWindow: 300
  trustProxyIdentity: true
metrics:
  serviceMonitor: false
  interval: 30s
backups:
  enabled: false
  schedule: 0 3 * * *
  bucket: ''
  retentionDays: 0
ezua:
  enabled: true
  virtualService:
    endpoint: rag-mcp-server.${DOMAIN_NAME}
    istioGateway: istio-system/ezaf-gateway
    timeout: 300s
    longTimeout: 3600s
  authorizationPolicy:
    enabled: true
    namespace: istio-system
    providerName: oauth2-proxy

replicaCount: 4
image:
  repository: ghcr.io/ai-solution-eng/multimodal-rag-mcp
  tag: v4.0.4
  pullPolicy: IfNotPresent
deployment:
  name: rag-mcp-server
  appName: rag-mcp-server
app:
  workers: 4
  syncPoolSize: 64
  mcpPoolSize: 64
  embeddingQueryBatchSize: 128
  embeddingQueryBatchWaitMs: 200
  embeddingQueryIdleWaitMs: 50
  embeddingMaxImagesPerPrompt: 4
  qdrantQueryBatchSize: 128
  qdrantQueryBatchWaitMs: 5
  qdrantPoolSize: 16
persistence:
  data:
    size: 100Gi
    storageClass: gl4f-filesystem
    accessMode: ReadWriteMany
  qdrant:
    size: 100Gi
    storageClass: gl4f-filesystem
    accessMode: ReadWriteOnce
    mountReadOnly: false
models:
  embedder:
    name: RamManavalan/Qwen3-VL-Embedding-8B-FP8
    url: ''
    className: MultiModalEmbeddings
    extra:
      embedding_dim: 4096
      chunk_size: 2048
      chunk_overlap: 256
      code_chunk_size: 8192
      code_chunk_overlap: 512
      tokenizer_name: Qwen/Qwen3-VL-Embedding-8B
      tokenizer_type: HuggingFace
      # Same-embedder alias for the dataset fingerprint guard: datasets indexed
      # under this id keep working after the FP8 swap (vectors agree to >=0.95 cosine).
      # Requires an image with alias support — v4.0.0 rejects unknown extra keys.
      alias: Qwen/Qwen3-VL-Embedding-8B
  reranker:
    name: Qwen/Qwen3-VL-Reranker-8B
    url: ''
    className: MultiModalReranker
    extra: {}
  vlm:
    name: Qwen/Qwen3.8-27B-FP8
    url: ''
    extra: {}
  asr:
    name: CohereLabs/cohere-transcribe-03-2026
    url: ''
    extra: {}
modelSecrets:
  embedderApiKey: ''
  rerankerApiKey: ''
  vlmApiKey: ''
  asrApiKey: ''
modelPool:
  maxConnections: 200
  maxKeepaliveConnections: 50
s3:
  endpointUrl: http://minio.minio.svc.cluster.local:9000
  accessKeyId: ''
  secretAccessKey: ''
rag:
  ocr: false
  captionWithAsr: true
  captionWithVlm: true
  remote: false
  dedupThreshold: 0.995
  deferCountSync: true
qdrant:
  replicas: 3
  image:
    repository: qdrant/qdrant
    tag: v1.19.0
    pullPolicy: IfNotPresent
  grpcPort: 6334
  httpPort: 6333
  client:
    preferGrpc: true
    timeout: 30
    quantization: int8
    quantizationAlwaysRam: true
  telemetryDisabled: true
redis:
  enabled: true
  image:
    repository: redis
    tag: 7-alpine
    pullPolicy: IfNotPresent
  port: 6379
  password: ''
mcp:
  enabled: true
  port: 9090
  apiKey:
    existingSecret: ""
    existingSecretKey: api-keys
embedBatcher:
  enabled: true
  port: 8002
service:
  api:
    type: ClusterIP
    port: 80
  mcp:
    type: ClusterIP
resources:
  app:
    requests:
      memory: 4Gi
      cpu: 2
    limits:
      memory: 8Gi
      cpu: 4
  qdrant:
    requests:
      memory: 16Gi
      cpu: '4'
    limits:
      memory: 32Gi
      cpu: '8'
  redis:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 500m
  embedBatcher:
    requests:
      memory: 512Mi
      cpu: 500m
    limits:
      memory: 1Gi
      cpu: '2'
antiAffinity:
  enabled: true
extraEnv: {}
security:
  # REST API-key (RAG_API_KEY) + media-token HMAC secret (MEDIA_TOKEN_SECRET,
  # 64 hex): the chart ships NO key material (P0-7, 2026-09 — the previously
  # committed default literals were removed from the delivery path; the values
  # themselves are private and were NOT rotated). Sourcing precedence —
  #   1. security.existingSecret: a Secret you own provides both keys
  #      (existingSecretApiKey / existingSecretMediaTokenKey names below)
  #   2. inline value here (kept for back-compat with existing values files)
  #   3. the value already stored in the release Secret — reused on upgrade,
  #      so upgrading never rotates a secret under a running deployment
  #   4. fresh auto-generation on first install
  # Retrieve an auto-generated key: kubectl -n <ns> get secret \
  #   <deployment.name>-model-keys -o jsonpath='{.data.RAG_API_KEY}' | base64 -d
  # Rotation is OPTIONAL and operator-initiated — read helm/ROTATION.md first.
  apiKey: ''
  mediaTokenSecret: ''
  # Optional Secret (you manage it) providing both keys; when set the chart
  # renders neither key into its own Secret.
  existingSecret: ''
  existingSecretApiKey: RAG_API_KEY
  existingSecretMediaTokenKey: MEDIA_TOKEN_SECRET
  mediaTokenTtl: 3600
  ingestAllowHosts: ''
  blockPrivateHosts: true
  maxDownloadBytes: 536870912
  archiveMaxTotalBytes: 2147483648
  archiveMaxMemberBytes: 1073741824
  archiveMaxEntries: 10000
  mediaAllowPathPrefixes: /data/datasets:/data/staging
  pwMaxFailures: 10
  pwFailWindow: 300
  trustProxyIdentity: true
  # Gate the /metrics exposition behind an API key (env RAG_METRICS_AUTH).
  # false (default) = public in-cluster exposition, unchanged behaviour.
  # true = every scrape must present X-RAG-Api-Key / X-API-Key / a Bearer key
  # (RAG_API_KEY plus the MCP key set MCP_API_KEYS / RAG_API_KEYS are all
  # accepted).
  metricsAuth: false
metrics:
  serviceMonitor: false
  interval: 30s
backups:
  enabled: false
  schedule: 0 3 * * *
  bucket: ''
  retentionDays: 0
ezua:
  enabled: true
  virtualService:
    endpoint: rag-mcp-server.${DOMAIN_NAME}
    istioGateway: istio-system/ezaf-gateway
    timeout: 300s
    longTimeout: 3600s
  authorizationPolicy:
    enabled: true
    namespace: istio-system
    providerName: oauth2-proxy

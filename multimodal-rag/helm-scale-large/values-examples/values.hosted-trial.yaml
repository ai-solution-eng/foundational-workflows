# ============================================================================
# Multimodal RAG — HOSTED TRIAL values (sanitized) — helm-scale-large/ chart.
# Variant: rag-mcp-scale-large (4 API replicas x 4 workers, 3-shard Qdrant,
# Redis unlock cache, shared embed-batcher singleton).
# Sanitized for a CUSTOMER PCAI cluster: PCAI substitutes ${DOMAIN_NAME};
# oauth2-proxy AuthorizationPolicy is ON at the gateway; the pre-install Kyverno
# vendor-label ClusterPolicy labels Deployments/Services only (Pods unlabeled).
# ALL credentials are fillers — this folder is hardlinked to the public repo.
# PCAI: paste this file into the release's Helm Values editor, adjust, apply.
# Full guide: documentation/DEPLOYMENT.md + documentation/SCALE.md.
# ============================================================================

# ### REQUIRED ### — key material lives in Secrets you own, NOT in values
# (missing Secret = CreateContainerError; every key the Secret carries
# overrides the values seeds below it).
#   1. modelSecrets.existingSecret — the broad secret: MODEL_*_API_KEY per
#      enabled role, optionally MODEL_*_URL / S3_* / REDIS_PASSWORD.
#   2. models.embedder.url — reachable embedder endpoint (startup ABORTS if
#      unreachable) unless the Secret carries MODEL_EMBEDDER_URL.
#   3. security.existingSecret — RAG_API_KEY + MEDIA_TOKEN_SECRET.
#      Rotation runbook: helm/ROTATION.md.
#   4. ezua.virtualService.endpoint — RENDER FAILS without it while ezua.enabled.

# ### OPTIONAL ###
# Major tuning setups (copy the shape from the pointer):
#   Scaling: replicaCount / qdrant.replicas / app.workers — SCALE.md §12
#   MCP API-key gate: mcp.apiKey.existingSecret (pre-create the Secret) — §2
#   Metrics: metrics.serviceMonitor (+ bearer Secret when security.metricsAuth) — §2
#   Storage: s3.* / backups.* / watchedSources.* (each source REQUIRES dataset + >=1 prefix) — §2 + §7b
#   Optional model roles: models.reranker / vlm / asr (url "" disables) — §2
#   RAG pipeline: rag.ocr / rag.contextual / rag.rrfDefault — §2

# ============================================================================
# Image / Scaling
# ============================================================================

deployment:
  name: rag-mcp-server
  appName: rag-mcp-server

replicaCount: 4

image:
  # Packaged with the chart — leave as-is unless you built your own image.
  repository: ghcr.io/ai-solution-eng/multimodal-rag-mcp
  tag: v6.0.0
  pullPolicy: IfNotPresent

qdrant:
  replicas: 3
  image:
    repository: qdrant/qdrant
    tag: v1.19.2
    pullPolicy: IfNotPresent
  grpcPort: 6334
  httpPort: 6333
  # gRPC + hard timeout + int8 quantization for new collections.
  client:
    preferGrpc: true
    timeout: 30
    quantization: int8
    # Deprecated: superseded by quantizationMemory (pinned|cached|cold).
    # Still honoured as a fallback (true -> pinned, false -> cold).
    quantizationMemory: pinned
  telemetryDisabled: true

# Shares dataset unlock state across API replicas so a user unlocks once.
redis:
  enabled: true
  image:
    repository: redis
    tag: 7-alpine
    pullPolicy: IfNotPresent
  port: 6379
  password: ""

# Shared singleton: all pods POST text-only embedding queries here, so batch size stays independent of process count.
embedBatcher:
  enabled: true
  port: 8002

# ============================================================================
# Resources
# ============================================================================

resources:
  app:
    requests: {cpu: 2, memory: 4Gi}
    limits: {cpu: 4, memory: 8Gi}

  qdrant:
    requests: {cpu: '4', memory: 16Gi}
    limits: {cpu: '8', memory: 32Gi}

  redis:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: 500m, memory: 512Mi}

  embedBatcher:
    requests: {cpu: 500m, memory: 512Mi}
    limits: {cpu: '2', memory: 1Gi}

persistence:
  data:
    size: 100Gi
    storageClass: gl4f-filesystem
    accessMode: ReadWriteMany

  qdrant:
    size: 100Gi
    storageClass: gl4f-filesystem
    accessMode: ReadWriteOnce
    mountReadOnly: false

# ============================================================================
# App Parallelism
# ============================================================================

# gunicorn + UvicornWorker: concurrency = replicaCount * workers * syncPoolSize.
app:
  workers: 4
  syncPoolSize: 64
  mcpPoolSize: 64
  embeddingQueryBatchSize: 128
  embeddingQueryBatchWaitMs: 200
  # Idle early-flush: a small stalled queue flushes after this many ms; 0 disables.
  embeddingQueryIdleWaitMs: 50
  embeddingMaxImagesPerPrompt: 4
  qdrantQueryBatchSize: 128
  qdrantQueryBatchWaitMs: 5
  qdrantPoolSize: 16

# Per-process httpx connection pool limits for model endpoint clients.
modelPool:
  maxConnections: 200
  maxKeepaliveConnections: 50

# ============================================================================
# Secrets
# ============================================================================

# Point each role at the customer's model-serving (MLIS) endpoint; the
# embedder is the only required one. Leave url "" to disable a role.
models:
  embedder:
    name: RamManavalan/Qwen3-VL-Embedding-8B-FP8
    url: ""
    className: MultiModalEmbeddings
    extra:
      embedding_dim: 4096
      chunk_size: 2048
      chunk_overlap: 256
      code_chunk_size: 8192
      code_chunk_overlap: 512
      tokenizer_name: Qwen/Qwen3-VL-Embedding-8B
      tokenizer_type: HuggingFace
      # Fingerprint-guard alias: datasets indexed under the old id survive the FP8 swap.
      alias: Qwen/Qwen3-VL-Embedding-8B

  reranker:
    name: Qwen/Qwen3-VL-Reranker-8B
    # optional — precision at the cost of latency
    url: ""
    className: MultiModalReranker
    extra: {}

  vlm:
    name: Qwen/Qwen3.8-27B-FP8
    # optional — captions images/videos, converts them at query time
    url: ""
    extra: {}

  asr:
    name: CohereLabs/cohere-transcribe-03-2026
    # optional — transcribes audio + video soundtracks
    url: ""
    extra: {}

# Rendered into the <name>-model-keys Secret (env MODEL_*_API_KEY).
modelSecrets:
  # Broad secret: MODEL_*_API_KEY (+ optional MODEL_*_URL, S3_*, REDIS_PASSWORD) — build from helm/local/secrets.template.yaml.
  existingSecret: ""
  embedderApiKey: "<EMBEDDER_API_KEY>"
  rerankerApiKey: "<RERANKER_API_KEY>"
  vlmApiKey: "<VLM_API_KEY>"
  asrApiKey: "<ASR_API_KEY>"

# ============================================================================
# App Defaults
# ============================================================================

rag:
  ocr: false
  captionWithAsr: true
  captionWithVlm: true
  # false = ".serving." URLs rewritten to in-cluster .svc form; true only for endpoints outside the cluster.
  remote: false
  dedupThreshold: 0.995
  # Multi-replica: document counts are not auto-synced from Qdrant on every read.
  deferCountSync: true
  # Ingest-time contextual retrieval — OFF; the per-dataset checkbox is the recommended path.
  contextual: false

  # Weighted-RRF create-time defaults — DISABLED (per-dataset is the path).
  rrfDefault:
    enabled: false
    dense: 1.0
    sparse: 1.0
    k: 2

  # Caps explicit unlock TTLs; 0 = the /access "No expiry (0)" option becomes selectable.
  unlockMaxTtl: 86400

mcp:
  apiKey:
    # pre-create first — the chart never creates/inlines this key:
    # kubectl -n <ns> create secret generic mcp-fleet-apikeys --from-literal='api-keys=<key1>,<key2>'
    existingSecret: "mcp-fleet-apikeys"
    existingSecretKey: "api-keys"
  # Per-user keys + ACLs — key material; empty = single-key behaviour.
  apiKeyClients: ""
  datasetAcls: ""

  enabled: true
  port: 9090

antiAffinity:
  enabled: true

extraEnv: {}

# ============================================================================
# Security
# ============================================================================

# mediaTokenSecret is REQUIRED: both containers refuse to start without it.
# Generate: python -c "import secrets; print(secrets.token_hex(32))"
security:
  # REST API-key auth: when non-empty every /api/* call must send X-RAG-Api-Key;
  # leave '' to auto-generate per install, or use security.existingSecret.
  apiKey: "<RAG_API_KEY>"
  mediaTokenSecret: "<MEDIA_TOKEN_SECRET>"
  # Optional: a Secret you manage providing both keys (key names below).
  existingSecret: ''
  existingSecretApiKey: RAG_API_KEY
  existingSecretMediaTokenKey: MEDIA_TOKEN_SECRET
  mediaTokenTtl: 3600
  ingestAllowHosts: ''
  blockPrivateHosts: true
  maxDownloadBytes: 536870912
  archiveMaxTotalBytes: 2147483648
  archiveMaxMemberBytes: 1073741824
  archiveMaxEntries: 10000
  mediaAllowPathPrefixes: /data/datasets:/data/staging
  pwMaxFailures: 10
  pwFailWindow: 300
  # Keep true: behind oauth2-proxy the identity headers are authoritative
  # (chart default is now false).
  trustProxyIdentity: true

  # Per-user self-selection off: central oauth2-proxy owns identity here.
  accessStore: false
  # Comma-separated datasets that can never be self-selected.
  accessDenySelect: ''
  # accessSelfMint is OPT-IN (chart default false since 2026-10-16) and stays
  # unset here — INERT anyway while accessStore is false.
  # Fallback memory dataset (RAG_MEMORY_DEFAULT) for callers without a ★ binding.
  memoryDefault: ''
  # Keep false: in-cluster Prometheus scrapes without a token (if true, set metrics.serviceMonitorBearerSecret).
  metricsAuth: false

metrics:
  serviceMonitor: false
  interval: 30s
  # With metricsAuth on: the Secret/key the ServiceMonitor presents as its scrape bearer token.
  serviceMonitorBearerSecret: ''
  serviceMonitorBearerSecretKey: RAG_API_KEY

# ============================================================================
# S3 Related
# ============================================================================

s3:
  # point at the site's MinIO/S3 if batch-URL ingest or backups are used
  endpointUrl: http://minio.minio.svc.cluster.local:9000
  accessKeyId: ""
  secretAccessKey: ""

backups:
  enabled: false
  schedule: 0 3 * * *
  bucket: ''
  retentionDays: 0
  # Optional Secret (keys = dataset names, values = passwords) so
  # password-protected datasets are backed up too; '' = skip them.
  protectedPasswords:
    existingSecret: ''

# Opt-in reconciler CronJob: each tick POSTs each source's s3:// prefixes to
# batch-urls (new/changed ingest, deleted pruned). s3:// directory URLs only.
watchedSources:
  enabled: false
  schedule: '*/30 * * * *'
  sources: []
  # Each source: dataset name + >=1 s3:// directory prefix (validated at render).

# ============================================================================
# PCAI Networking
# ============================================================================

service:
  api:
    type: ClusterIP
    port: 80

  mcp:
    type: ClusterIP

ezua:
  enabled: true
  virtualService:
    # ${DOMAIN_NAME} is substituted by PCAI; change only the host prefix
    endpoint: rag-mcp-server.${DOMAIN_NAME}
    istioGateway: istio-system/ezaf-gateway
    timeout: 300s
    longTimeout: 3600s

  authorizationPolicy:
    # Enabled for hosted trials: customer SSO via oauth2-proxy at the gateway.
    enabled: true
    namespace: istio-system
    providerName: oauth2-proxy

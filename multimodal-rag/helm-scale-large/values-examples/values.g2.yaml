# =============================================================================
# Multimodal RAG — SE G2 deployment values (sanitized) — scale-large chart.
#
# Variant: helm-scale-large/ (4 API replicas x 4 workers, 3-shard Qdrant,
# Redis unlock cache, shared embed-batcher). Pilots: helm/.
# Sanitized from helm-scale-large/local/values.g2.yaml: real serving URLs,
# all credentials are fillers (this folder is hardlinked to the public repo).
# PCAI: paste into the release's Helm Values editor, adjust fillers, apply.
#
# ### REQUIRED ### — key material lives in Secrets you own, NOT in values
# (missing Secret = CreateContainerError; every key the Secret carries
# overrides the values seeds below it).
#   1. modelSecrets.existingSecret — the broad secret: MODEL_*_API_KEY per
#      enabled role, optionally MODEL_*_URL / S3_* / REDIS_PASSWORD
#   2. models.embedder.url — reachable embedder endpoint (startup ABORTS if
#      unreachable) unless the Secret carries MODEL_EMBEDDER_URL
#   3. security.existingSecret — RAG_API_KEY + MEDIA_TOKEN_SECRET
#   4. ezua.virtualService.endpoint — RENDER FAILS without it while ezua.enabled
#
# ### OPTIONAL ### — pointers: DEPLOYMENT.md / SCALE.md
#   Scaling / antiAffinity / qdrant.replicas — SCALE.md
#   SSO stack (oidc / sso / ssoGate / trustProxyIdentity) — DEPLOYMENT.md §5b
#   Storage (s3 / backups / watchedSources) — DEPLOYMENT.md §7b
# =============================================================================

# ============================================================================
# Image / Scaling
# ============================================================================

deployment:
  name: rag-mcp-server
  appName: rag-mcp-server

replicaCount: 4

image:
  repository: ghcr.io/ai-solution-eng/multimodal-rag-mcp
  tag: v5.9.5
  pullPolicy: IfNotPresent

qdrant:
  replicas: 3

  image:
    repository: qdrant/qdrant
    tag: v1.19.2
    pullPolicy: IfNotPresent

  grpcPort: 6334
  httpPort: 6333

  client:
    preferGrpc: true
    timeout: 30
    quantization: int8
    quantizationAlwaysRam: true

  telemetryDisabled: true

redis:
  enabled: true
  image:
    repository: redis
    tag: 7-alpine
    pullPolicy: IfNotPresent
  port: 6379
  password: ''

embedBatcher:
  enabled: true
  port: 8002

# ============================================================================
# Resources
# ============================================================================

resources:
  app:
    requests: {cpu: 2, memory: 4Gi}
    limits: {cpu: "3", memory: 8Gi}

  qdrant:
    requests: {cpu: "3", memory: 10Gi}
    limits: {cpu: "6", memory: 20Gi}

  redis:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: 500m, memory: 512Mi}

  embedBatcher:
    requests: {cpu: 500m, memory: 512Mi}
    limits: {cpu: "2", memory: 1Gi}

persistence:
  data:
    size: 40Gi
    storageClass: gl4f-filesystem
    accessMode: ReadWriteMany

  qdrant:
    size: 25Gi
    storageClass: gl4f-filesystem
    accessMode: ReadWriteOnce
    mountReadOnly: false

# ============================================================================
# App Parallelism
# ============================================================================

# One shared ConfigMap feeds api + mcp + embed-batcher + cronjobs.
app:
  workers: 4
  syncPoolSize: 64
  mcpPoolSize: 64
  embeddingQueryBatchSize: 128
  embeddingQueryBatchWaitMs: 200
  embeddingQueryIdleWaitMs: 50
  embeddingMaxImagesPerPrompt: 4
  qdrantQueryBatchSize: 128
  qdrantQueryBatchWaitMs: 5
  qdrantPoolSize: 16

modelPool:
  maxConnections: 200
  maxKeepaliveConnections: 50

# ============================================================================
# Secrets
# ============================================================================

models:
  embedder:
    name: RamManavalan/Qwen3-VL-Embedding-8B-FP8
    url: https://qwen3-vl-embedding-8b.project-user-andrew-bydlon.serving.${DOMAIN_NAME}
    className: MultiModalEmbeddings
    extra:
      embedding_dim: 4096
      chunk_size: 2048
      chunk_overlap: 256
      code_chunk_size: 8192
      code_chunk_overlap: 512
      tokenizer_name: Qwen/Qwen3-VL-Embedding-8B
      tokenizer_type: HuggingFace
      alias: Qwen/Qwen3-VL-Embedding-8B

  reranker:
    name: Qwen/Qwen3-VL-Reranker-8B
    url: https://qwen3-vl-reranker-8b.project-user-andrew-bydlon.serving.${DOMAIN_NAME}
    className: MultiModalReranker
    extra: {}

  vlm:
    name: Qwen/Qwen3.8-27B-FP8
    url: https://qwen-38-27b.project-user-andrew-bydlon.serving.${DOMAIN_NAME}
    extra: {}

  asr:
    name: CohereLabs/cohere-transcribe-03-2026
    url: https://cohere-transcribe-03-2026.project-user-andrew-bydlon.serving.${DOMAIN_NAME}
    extra: {}

modelSecrets:
  # Broad secret: MODEL_*_API_KEY (+ optional MODEL_*_URL, S3_*, REDIS_PASSWORD)
  # — build from helm/local/secrets.template.yaml. Seeds below are fallbacks.
  existingSecret: ""
  embedderApiKey: "<EMBEDDER_API_KEY>"
  rerankerApiKey: "<RERANKER_API_KEY>"
  vlmApiKey: "<VLM_API_KEY>"
  asrApiKey: "<ASR_API_KEY>"

# ============================================================================
# App Defaults
# ============================================================================

rag:
  remote: false
  dedupThreshold: 0.995
  deferCountSync: true

  ocr: false
  captionWithAsr: true
  captionWithVlm: true
  contextual: false

  rrfDefault:
    enabled: false
    dense: 1.0
    sparse: 1.0
    k: 2

  unlockMaxTtl: 0

mcp:
  enabled: true
  port: 9090

  apiKey:
    existingSecret: mcp-fleet-apikeys
    existingSecretKey: api-keys

antiAffinity:
  enabled: true

# ============================================================================
# Security
# ============================================================================

security:
  existingSecret: rag-platform-keys
  existingSecretApiKey: RAG_API_KEY
  existingSecretMediaTokenKey: MEDIA_TOKEN_SECRET
  apiKey: ''
  mediaTokenSecret: ''
  mediaTokenTtl: 3600

  # TRUE by choice (chart default is now false): this site's every path
  # traverses the enforcing oauth2-proxy AuthorizationPolicy below.
  trustProxyIdentity: true
  accessStore: true
  accessSelfMint: true
  memoryDefault: ''

  oidc:
    enabled: true
    issuer: "https://keycloak.${DOMAIN_NAME}/realms/UA"
    audience: ua
    identityClaim: preferred_username
    # In-cluster Keycloak headless service (plain HTTP inside the mesh).
    jwksUrl: "http://keycloak-headless.keycloak.svc.cluster.local:8080/realms/UA/protocol/openid-connect/certs"
    jwksRefreshSeconds: 3600
    observedTtl: 86400
    fetchTimeoutSeconds: 3
    clockSkewSeconds: 60

    platformCa:
      configMapName: ezaf-root-ca
      configMapKey: ezaf-root-ca.crt

    sso:
      enabled: true
      clientId: ua
      # Substituted by the PCAI values editor at deploy time.
      clientSecret: "${OIDC_CLIENT_SECRET}"
      clientExistingSecret: ""
      clientExistingSecretKey: clientSecret
      redirectUri: "https://rag-mcp-server.${DOMAIN_NAME}/oauth/oidc/callback"
      providerUrl: "https://keycloak.${DOMAIN_NAME}/realms/UA/.well-known/openid-configuration"
      scopes: "openid profile email"
      cookieName: pcai-sso
      cookieMaxAgeSeconds: 43200
      cookieSecure: true

  ssoGate: false

metrics:
  serviceMonitor: false
  interval: 30s
  serviceMonitorBearerSecret: ''
  serviceMonitorBearerSecretKey: RAG_API_KEY

# ============================================================================
# S3 Related
# ============================================================================

s3:
  endpointUrl: http://minio.minio.svc.cluster.local:9000
  accessKeyId: ''
  secretAccessKey: ''

watchedSources:
  enabled: false
  schedule: '*/30 * * * *'
  sources: []
  # sources:
  #   - dataset: reports
  #     prefixes: [s3://bucket/prefix/]

backups:
  enabled: false
  schedule: 0 3 * * *
  bucket: ''
  retentionDays: 0

# ============================================================================
# PCAI Networking
# ============================================================================

service:
  api:
    type: ClusterIP
    port: 80
  mcp:
    type: ClusterIP

ezua:
  enabled: true

  virtualService:
    endpoint: rag-mcp-server.${DOMAIN_NAME}
    istioGateway: istio-system/ezaf-gateway
    timeout: 300s
    longTimeout: 3600s

  authorizationPolicy:
    enabled: true
    namespace: istio-system
    providerName: oauth2-proxy

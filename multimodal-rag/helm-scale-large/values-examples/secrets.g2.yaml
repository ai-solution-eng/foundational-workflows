# ============================================================================
# secrets.g2.yaml — key-removed companion to values.g2.yaml (secret-free)
# ----------------------------------------------------------------------------
# The four Secrets the G2 deployment uses, with every credential replaced by
# a <FILL:...> placeholder.  Pair it with values.g2.yaml in this folder:
#
#   cp secrets.g2.yaml /somewhere/outside/git/   # then fill the <FILL:...>s
#   kubectl apply -n mm-rag -f secrets.g2.yaml
#
# and set these values keys (values.g2.yaml marks the spots):
#
#   modelSecrets.existingSecret: rag-model-keys          # doc 1
#   security.existingSecret: rag-platform-keys           # doc 2 (already set)
#   mcp.apiKey.existingSecret: mcp-fleet-apikeys         # doc 3 (already set)
#   backups.protectedPasswords.existingSecret: rag-dataset-passwords  # doc 4
#
# LIVE key material never lives in this repo: fill a copy outside git, keep
# mode 0600.  Rotation = edit the applied Secret, re-apply — pods hot-reload
# in <=15s, no rollout.  Runbook: helm/ROTATION.md.  CAUTION: kubectl apply
# does NOT envsubst — resolve the <SITE-DOMAIN> in the MODEL_*_URL entries to
# the real site domain before applying (PCAI's ${DOMAIN_NAME} pipeline only
# covers values, not kubectl).
# ============================================================================

---
# ── Doc 1: model API keys + endpoints + S3/MinIO credentials ───────────────
# Consumed via modelSecrets.existingSecret.  Every key here OVERRIDES the
# chart-managed Secret / values seeds per-key.  While MODEL_*_URL entries
# exist, values models.*.url edits are INERT — rotate URLs here.
apiVersion: v1
kind: Secret
metadata:
  name: rag-model-keys
  namespace: mm-rag            # SITE: the release namespace
  labels:
    app: rag-mcp-server
type: Opaque
stringData:
  MODEL_EMBEDDER_API_KEY: "<FILL:embedder-api-key>"
  MODEL_RERANKER_API_KEY: "<FILL:reranker-api-key>"
  MODEL_VLM_API_KEY: "<FILL:vlm-api-key>"
  MODEL_ASR_API_KEY: "<FILL:asr-api-key>"
  MODEL_EMBEDDER_URL: "https://qwen3-vl-embedding-8b.project-user-<USER>.serving.<SITE-DOMAIN>"
  MODEL_RERANKER_URL: "https://qwen3-vl-reranker-8b.project-user-<USER>.serving.<SITE-DOMAIN>"
  MODEL_VLM_URL: "https://qwen-38-27b.project-user-<USER>.serving.<SITE-DOMAIN>"
  MODEL_ASR_URL: "https://cohere-transcribe-03-2026.project-user-<USER>.serving.<SITE-DOMAIN>"
  S3_ACCESS_KEY_ID: "<FILL:s3-access-key-id>"
  S3_SECRET_ACCESS_KEY: "<FILL:s3-secret-access-key>"
  # Redis unlock-cache password (scale charts; empty = unauthenticated):
  REDIS_PASSWORD: ""

---
# ── Doc 2: REST API key + media-token HMAC secret ──────────────────────────
# Consumed via security.existingSecret (RAG_API_KEY + MEDIA_TOKEN_SECRET).
# RAG_API_KEY is also what MCP clients and the OWUI function send as
# X-RAG-Api-Key — rotate it in BOTH places (Secret + client valves).
apiVersion: v1
kind: Secret
metadata:
  name: rag-platform-keys
  namespace: mm-rag            # SITE: the release namespace
  labels:
    app: rag-mcp-server
  annotations:
    "helm.sh/resource-policy": keep   # survives helm uninstall
type: Opaque
stringData:
  RAG_API_KEY: "<FILL:rest-api-key>"             # e.g. openssl rand -hex 16
  MEDIA_TOKEN_SECRET: "<FILL:media-token-64-hex>" # e.g. openssl rand -hex 32

---
# ── Doc 3: MCP API keys (optional gate) ────────────────────────────────────
# Consumed via mcp.apiKey.existingSecret (key api-keys).  Comma-separated
# list = multiple valid keys (rotation: append, move clients, drop old).
apiVersion: v1
kind: Secret
metadata:
  name: mcp-fleet-apikeys
  namespace: mm-rag            # SITE: the release namespace
  labels:
    app: rag-mcp-server
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
stringData:
  api-keys: "<FILL:mcp-key1>,<FILL:mcp-key2>"

---
# ── Doc 4: dataset passwords for the backup CronJob ────────────────────────
# Consumed via backups.protectedPasswords.existingSecret — one key per
# PROTECTED dataset (key = dataset name, value = its password).  Protected
# datasets without a matching key are skipped with a SKIP-PROTECTED log
# line.  Create BEFORE setting the values key (the CronJob pod fails on a
# missing Secret volume).  Restoring a protected dataset: pass `password`
# to POST /api/admin/datasets/import (exports strip the password hash).
apiVersion: v1
kind: Secret
metadata:
  name: rag-dataset-passwords
  namespace: mm-rag            # SITE: the release namespace
  labels:
    app: rag-mcp-server
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
stringData:
  # example pair — one line per protected dataset
  example-dataset: "<FILL:dataset-password>"

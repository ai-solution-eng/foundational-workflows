apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.deployment.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.deployment.appName }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.deployment.appName }}
  template:
    metadata:
      labels:
        app: {{ .Values.deployment.appName }}
    spec:
      containers:
        - name: rag-api-server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - python
            - -m
            - multimodal_rag.api_server
          args:
            - --host
            - "0.0.0.0"
            - --port
            - "8000"
            - --data-path
            - "/data"
            - --qdrant-host
            - {{ .Values.deployment.name }}-qdrant
            - --qdrant-port
            - "6333"
          envFrom:
            - configMapRef:
                name: {{ .Values.deployment.name }}-config
            - secretRef:
                name: {{ .Values.deployment.name }}-model-keys
          env:
            - name: RAG_REMOTE
              value: {{ .Values.rag.remote | quote }}
            {{- range $key, $val := .Values.extraEnv }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
          ports:
            - containerPort: 8000
              name: http
          volumeMounts:
            - name: data
              mountPath: /data
          resources: {{ toYaml .Values.resources.app | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3

        {{- if .Values.mcp.enabled }}
        - name: rag-mcp-server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - python
            - -m
            - multimodal_rag.mcp_server
          args:
            - --transport
            - streamable-http
            - --host
            - "0.0.0.0"
            - --port
            - {{ .Values.mcp.port | quote }}
            - --data-path
            - "/data"
            - --qdrant-host
            - {{ .Values.deployment.name }}-qdrant
            - --qdrant-port
            - "6333"
          envFrom:
            - configMapRef:
                name: {{ .Values.deployment.name }}-config
            - secretRef:
                name: {{ .Values.deployment.name }}-model-keys
          env:
            - name: RAG_REMOTE
              value: {{ .Values.rag.remote | quote }}
            {{- range $key, $val := .Values.extraEnv }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
          ports:
            - containerPort: {{ .Values.mcp.port }}
              name: mcp
          volumeMounts:
            - name: data
              mountPath: /data
          resources: {{ toYaml .Values.resources.app | nindent 12 }}
        {{- end }}

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.deployment.name }}-data

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.deployment.name }}-embed-batcher
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.deployment.name }}-embed-batcher
spec:
  # MUST stay at 1: this is a singleton aggregator.  More replicas would
  # split the batch pool again and defeat the entire purpose.
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.deployment.name }}-embed-batcher
  template:
    metadata:
      labels:
        app: {{ .Values.deployment.name }}-embed-batcher
    spec:
      automountServiceAccountToken: false
      containers:
        - name: embed-batcher
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          command: ["python", "-m", "multimodal_rag.embed_batcher"]
          args: ["--host", "0.0.0.0", "--port", {{ .Values.embedBatcher.port | quote }}]
          envFrom:
            - configMapRef:
                name: {{ .Values.deployment.name }}-config
            - secretRef:
                name: {{ .Values.deployment.name }}-model-keys
          env:
            - name: RAG_REMOTE
              value: {{ .Values.rag.remote | quote }}
            - name: CONFIG_DIR
              value: "/etc/rag/config:/etc/rag/secrets"
            # Never route to ourselves (would recurse).
            - name: RAG_EMBED_BATCH_URL
              value: ""
            {{- range $key, $val := .Values.extraEnv }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
          ports:
            - containerPort: {{ .Values.embedBatcher.port }}
              name: http
          volumeMounts:
            - name: rag-config
              mountPath: /etc/rag/config
              readOnly: true
            - name: rag-model-keys
              mountPath: /etc/rag/secrets
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources: {{ toYaml .Values.resources.embedBatcher | nindent 12 }}
          startupProbe:
            httpGet:
              path: /readyz
              port: {{ .Values.embedBatcher.port }}
            failureThreshold: 30
            periodSeconds: 5
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: {{ .Values.embedBatcher.port }}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.embedBatcher.port }}
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
      volumes:
        - name: rag-config
          configMap:
            name: {{ .Values.deployment.name }}-config
        - name: rag-model-keys
          secret:
            secretName: {{ .Values.deployment.name }}-model-keys
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.deployment.name }}-embed-batcher
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.deployment.name }}-embed-batcher
spec:
  type: ClusterIP
  selector:
    app: {{ .Values.deployment.name }}-embed-batcher
  ports:
    - name: http
      port: {{ .Values.embedBatcher.port }}
      targetPort: {{ .Values.embedBatcher.port }}
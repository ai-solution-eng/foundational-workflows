{{- if .Values.redis.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.deployment.name }}-redis
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.deployment.name }}-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.deployment.name }}-redis
  template:
    metadata:
      labels:
        app: {{ .Values.deployment.name }}-redis
    spec:
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: redis
          image: "{{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}"
          imagePullPolicy: {{ .Values.redis.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          command:
            - sh
            - -c
            - |
              {{- if .Values.redis.password }}
              exec redis-server --save "" --appendonly no --requirepass "$REDIS_PASSWORD"
              {{- else }}
              exec redis-server --save "" --appendonly no
              {{- end }}
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.deployment.name }}-model-keys
                  key: REDIS_PASSWORD
          ports:
            - containerPort: {{ .Values.redis.port }}
              name: redis
          resources: {{ toYaml .Values.resources.redis | nindent 12 }}
          livenessProbe:
            tcpSocket:
              port: {{ .Values.redis.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["sh", "-c", "redis-cli --no-auth-warning ${REDIS_PASSWORD:+-a \"$REDIS_PASSWORD\"} ping"]
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.deployment.name }}-redis
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.deployment.name }}-redis
spec:
  type: ClusterIP
  ports:
    - name: redis
      port: {{ .Values.redis.port }}
      targetPort: {{ .Values.redis.port }}
  selector:
    app: {{ .Values.deployment.name }}-redis
{{- end }}

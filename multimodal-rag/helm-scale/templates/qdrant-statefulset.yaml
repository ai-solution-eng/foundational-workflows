apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.deployment.name }}-qdrant
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.deployment.name }}-qdrant
spec:
  serviceName: {{ .Values.deployment.name }}-qdrant
  replicas: {{ .Values.qdrant.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.deployment.name }}-qdrant
  template:
    metadata:
      labels:
        app: {{ .Values.deployment.name }}-qdrant
    spec:
      containers:
        - name: qdrant
          image: "{{ .Values.qdrant.image.repository }}:{{ .Values.qdrant.image.tag }}"
          imagePullPolicy: {{ .Values.qdrant.image.pullPolicy }}
          env:
            # Tell Qdrant its advertised address so peers can bootstrap the
            # cluster. Each pod registers as <sts-name>-<ordinal>.
            - name: QDRANT__CLUSTER__ENABLED
              value: "true"
            - name: QDRANT__CLUSTER__P2P_PORT
              value: "6335"
          ports:
            - containerPort: {{ .Values.qdrant.grpcPort }}
              name: grpc
            - containerPort: {{ .Values.qdrant.httpPort }}
              name: http
            - containerPort: 6335
              name: p2p
          volumeMounts:
            - name: data
              mountPath: /qdrant/storage
          resources: {{ toYaml .Values.resources.qdrant | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.qdrant.httpPort }}
            initialDelaySeconds: 10
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [{{ .Values.persistence.qdrant.accessMode }}]
        {{- if .Values.persistence.qdrant.storageClass }}
        storageClassName: {{ .Values.persistence.qdrant.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.qdrant.size }}

# -- Global settings ----------------------------------------------------------
# Scale variant: multiple API replicas + gunicorn workers, multi-replica
# Qdrant, optional Redis for cross-pod unlock cache. See helm/ for the
# original single-replica chart.
replicaCount: 4
image:
  repository: andrewbydlon/rag-api-server
  tag: v1.9.5
  pullPolicy: IfNotPresent

deployment:
  name: rag-mcp-server
  appName: rag-mcp-server


# -- App server tuning --------------------------------------------------------
app:
  # Run the API server under gunicorn with UvicornWorker so each pod runs
  # `workers` event loops (one per process). Each worker gets its own
  # `sync_pool`, so effective concurrency ≈ replicaCount * workers *
  # syncPoolSize.
  workers: 4
  # Per-worker thread pool for blocking RAG work (embedding, Qdrant, file
  # processing). Falls back to 12 if unset (matches the single-replica
  # chart).
  syncPoolSize: 64
  # MCP server sync tools are converted to async + offloaded to a thread
  # pool of this size (per pod). Keep >= syncPoolSize to avoid starving.
  mcpPoolSize: 64
  # Dynamic query batcher for concurrent text-only search embeddings.
  # Collects queries arriving within the wait window and sends them as a
  # single /v1/embeddings call (vLLM processes batched input in one forward
  # pass). Larger window = bigger batches = fewer HTTP calls, at the cost
  # of added latency per query.
  embeddingQueryBatchSize: 128
  embeddingQueryBatchWaitMs: 200
  # Max images per embedding prompt (vLLM model limit, set in deployment args).
  embeddingMaxImagesPerPrompt: 4
  # Dynamic Qdrant query batcher for concurrent similarity searches.
  # Collects queries arriving within the wait window and sends them as a
  # single query_batch_points gRPC call. Short window (5ms) since the
  # embedding batcher already synchronises the burst.
  qdrantQueryBatchSize: 128
  qdrantQueryBatchWaitMs: 5


# -- Persistence ---------------------------------------------------------------
persistence:
  data:
    size: 100Gi
    storageClass: "gl4f-filesystem"
    accessMode: ReadWriteMany
  qdrant:
    size: 100Gi
    storageClass: "gl4f-filesystem"
    accessMode: ReadWriteOnce   # per-pod volume via volumeClaimTemplates
    # Disabled in the scale chart: Qdrant runs as a sharded cluster with one
    # PVC per replica, so there is no single PVC to mount on the API pods.
    mountReadOnly: false


# -- Model configuration ------------------------------------------------------
# Each model role has a URL (required to enable), an optional name (auto-
# detected from the endpoint's /v1/models listing when omitted), an optional
# className, and optional extra kwargs (serialised as JSON into the ConfigMap).
# API keys are set separately via `modelSecrets` (Kubernetes Secret).
# Set url to "" to disable a component.
models:
  embedder:
    name: "Qwen/Qwen3-VL-Embedding-8B"
    url: ""
    className: "MultiModalEmbeddings"
    extra:
      embedding_dim: 4096
      chunk_size: 2048
      chunk_overlap: 256
      code_chunk_size: 8192
      code_chunk_overlap: 512
      tokenizer_name: "Qwen/Qwen3-VL-Embedding-8B"
      tokenizer_type: "HuggingFace"
  reranker:
    name: "Qwen/Qwen3-VL-Reranker-8B"
    url: ""
    className: "MultiModalReranker"
    extra: {}
  vlm:
    name: "RedHatAI/gemma-4-31B-it-FP8-block"
    url: ""
    extra: {}
  asr:
    name: "CohereLabs/cohere-transcribe-03-2026"
    url: ""
    extra: {}

# -- Model API keys (sensitive) -----------------------------------------------
# These are stored in a Kubernetes Secret, not the ConfigMap.
# Provide via --set or a separate encrypted values file.
modelSecrets:
  embedderApiKey: ""
  rerankerApiKey: ""
  vlmApiKey: ""
  asrApiKey: ""

# Per-process httpx connection pool limit for model endpoint clients.
# Raised from the single-replica default of 30 so the embedder (on every
# search's critical path) is not the bottleneck.
modelPool:
  maxConnections: 200
  maxKeepaliveConnections: 50

# -- S3 / MinIO configuration --------------------------------------------------
# Endpoint URL is stored in the ConfigMap (not sensitive).
# Access keys are stored in the Kubernetes Secret.
s3:
  endpointUrl: "http://minio.minio.svc.cluster.local:9000"
  accessKeyId: ""
  secretAccessKey: ""

# -- RAG parameters -----------------------------------------------------------
rag:
  captionWithAsr: false  # Transcribe video audio tracks via ASR
  captionWithVlm: false  # VLM-describe images/videos at ingest (enables VLM-skip at retrieval)
  remote: false         # Use remote model URLs (vs in-cluster .svc.cluster.local)
  dedupThreshold: 0.995  # Cosine similarity above which a doc is considered a duplicate (0.0–1.0)
  # When true, get_dataset() does NOT auto-sync document_count from Qdrant
  # on every read. Counts are synced only on explicit admin requests. This
  # avoids cross-replica meta.json write races and cuts Qdrant load.
  deferCountSync: true

# -- Qdrant configuration -----------------------------------------------------
# Multi-replica Qdrant cluster with built-in sharding for read scaling.
qdrant:
  replicas: 3
  image:
    repository: qdrant/qdrant
    tag: "v1.18.2"
    pullPolicy: IfNotPresent
  grpcPort: 6334
  httpPort: 6333
  # Clients connect over gRPC (more efficient than HTTP at high QPS) with
  # a hard timeout so a hung Qdrant cannot pin a sync_pool thread forever.
  client:
    preferGrpc: true
    timeout: 30
    # Scalar quantization for new collections: "int8" (default, 4x memory
    # reduction, ~1-2% recall loss, faster search) or "none" (full float32).
    # Only affects newly created collections; existing ones keep their config.
    quantization: int8
    # Pin quantized vectors in RAM for fast search (default true).
    # Disable for very large datasets (2M+ points) to avoid OOM — quantized
    # vectors will be read from disk per-search instead.
    quantizationAlwaysRam: true


# -- Redis (optional cross-pod unlock cache) ----------------------------------
# When enabled, dataset unlock state is shared across API replicas so a user
# only unlocks once. When disabled, each pod keeps its own in-memory cache
# (a user may be prompted to re-unlock if routed to a different pod).
redis:
  enabled: true
  image:
    repository: redis
    tag: "7-alpine"
    pullPolicy: IfNotPresent
  port: 6379
  # TTL for unlock cache entries (seconds). 30 min matches the in-memory default.
  unlockTtl: 1800


# -- MCP server (optional sidecar) --------------------------------------------
# Runs alongside the API server and exposes the same retrieval pipeline
# as MCP tools over SSE transport. Tools are async + thread-offloaded.
mcp:
  enabled: true
  port: 9090

# -- Service configuration ----------------------------------------------------
service:
  api:
    type: ClusterIP
    port: 80
    targetPort: 8000
  mcp:
    type: ClusterIP


# -- Resource limits ----------------------------------------------------------
resources:
  app:
    requests:
      memory: "4Gi"
      cpu: 2
    limits:
      memory: "8Gi"
      cpu: 4
  qdrant:
    requests:
      memory: "16Gi"
      cpu: "4"
    limits:
      memory: "32Gi"
      cpu: "8"
  redis:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

# -- Pod anti-affinity (spread replicas across nodes) -------------------------
antiAffinity:
  enabled: true

# -- Environment variables (extra) --------------------------------------------
extraEnv: {}

# -- Security hardening (optional, opt-in) -----------------------------------
# Every guard is OFF / permissive by default so the chart behaves exactly as
# before — flip a value to enable the corresponding protection.

security:
  apiKey: ""
  mediaTokenSecret: ""
  mediaTokenTtl: 3600
  ingestAllowHosts: ""
  blockPrivateHosts: false
  maxDownloadBytes: 536870912
  archiveMaxTotalBytes: 2147483648
  archiveMaxMemberBytes: 1073741824
  archiveMaxEntries: 10000
  mediaAllowPathPrefixes: "/data/datasets:/data/staging"
  pwMaxFailures: 10
  pwFailWindow: 300

# -- PCAI ---------------------------------------------------------------------
ezua:
  enabled: true
  domainName: "${DOMAIN_NAME}"
  # configure the application endpoint

  virtualService:
    endpoint: "rag-mcp-server.${DOMAIN_NAME}"
    istioGateway: "istio-system/ezaf-gateway"
    timeout: 300s          # Default for normal API calls (search, list, read)
    longTimeout: 3600s     # For batch uploads, SSE streams, and MCP

  # configure the authorization policy
  authorizationPolicy:
    enabled: true
    namespace: "istio-system"
    providerName: "oauth2-proxy"

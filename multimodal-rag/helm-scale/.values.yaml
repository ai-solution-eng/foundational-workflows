# -- Global settings ----------------------------------------------------------
replicaCount: 1
image:
  repository: andrewbydlon/rag-api-server
  tag: v1.3.0
  pullPolicy: IfNotPresent

deployment:
  name: rag-mcp-server
  appName: rag-mcp-server


# -- Persistence ---------------------------------------------------------------
persistence:
  data:
    size: 50Gi
    storageClass: "gl4f-filesystem"
    accessMode: ReadWriteMany
  qdrant:
    size: 50Gi
    storageClass: "gl4f-filesystem"
    accessMode: ReadWriteMany


# -- Model configuration ------------------------------------------------------
# Each model role has a URL (required to enable), an optional name (auto-
# detected from the endpoint's /v1/models listing when omitted), an optional
# className, and optional extra kwargs (serialised as JSON into the ConfigMap).
# API keys are set separately via `modelSecrets` (Kubernetes Secret).
# Set url to "" to disable a component.
models:
  embedder:
    name: "Qwen/Qwen3-VL-Embedding-8B"
    url: "https://qwen3-vl-embedding-8b.project-user-andrew-bydlon.serving.pcai-se-ai-application.hst.rdlabs.hpecorp.net"
    className: "MultiModalEmbeddings"
    extra:
      embedding_dim: 4096
      chunk_size: 2048
      chunk_overlap: 256
      code_chunk_size: 8192
      code_chunk_overlap: 512
      tokenizer_name: "Qwen/Qwen3-VL-Embedding-8B"
      tokenizer_type: "HuggingFace"
  reranker:
    name: "Qwen/Qwen3-VL-Reranker-8B"
    url: "https://qwen3-vl-reranker-8b.project-user-andrew-bydlon.serving.pcai-se-ai-application.hst.rdlabs.hpecorp.net"
    className: "MultiModalReranker"
    extra: {}
  vlm:
    name: "RedHatAI/gemma-4-31B-it-FP8-block"
    url: "https://gemma-4-31b-ab.project-user-andrew-bydlon.serving.pcai-se-ai-application.hst.rdlabs.hpecorp.net"
    extra: {}
  asr:
    name: "CohereLabs/cohere-transcribe-03-2026"
    url: "https://cohere-transcribe-03-2026.project-user-andrew-bydlon.serving.pcai-se-ai-application.hst.rdlabs.hpecorp.net"
    extra: {}


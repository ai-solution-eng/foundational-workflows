replicaCount: 2
# -- Autoscaling (opt-in) -------------------------------------------------------
# When autoscaling.enabled, a HorizontalPodAutoscaler (templates/hpa.yaml) owns
# the API Deployment's replica count and `replicaCount` above is inert
# (spec.replicas is omitted from the Deployment so `helm upgrade` cannot reset
# the autoscaler's count). The HPA scales ONLY the API Deployment — never the
# Qdrant StatefulSet (shard topology + per-replica PVCs). Requires
# metrics-server in the cluster for resource metrics.
# minReplicas doubles as the HA floor: Redis (unlock cache), count-sync deferral
# and the shared RWX data PVC make extra replicas safe, but 1 replica is not
# high availability.
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
  # Stabilization window so bursty RAG traffic does not flap scale-down.
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
image:
  repository: ghcr.io/ai-solution-eng/multimodal-rag-mcp
  tag: v5.2.3
  pullPolicy: IfNotPresent
deployment:
  name: rag-mcp-server
  appName: rag-mcp-server
app:
  workers: 2
  syncPoolSize: 32
  mcpPoolSize: 32
  embeddingQueryBatchSize: 128
  embeddingQueryBatchWaitMs: 200
  embeddingQueryIdleWaitMs: 50
  embeddingMaxImagesPerPrompt: 4
  qdrantQueryBatchSize: 128
  qdrantQueryBatchWaitMs: 5
  qdrantPoolSize: 16
persistence:
  data:
    size: 50Gi
    storageClass: gl4f-filesystem
    accessMode: ReadWriteMany
  qdrant:
    size: 25Gi
    storageClass: gl4f-filesystem
    accessMode: ReadWriteOnce
    mountReadOnly: false
models:
  embedder:
    name: RamManavalan/Qwen3-VL-Embedding-8B-FP8
    url: ''
    className: MultiModalEmbeddings
    extra:
      embedding_dim: 4096
      chunk_size: 2048
      chunk_overlap: 256
      code_chunk_size: 8192
      code_chunk_overlap: 512
      tokenizer_name: Qwen/Qwen3-VL-Embedding-8B
      tokenizer_type: HuggingFace
      # Same-embedder alias for the dataset fingerprint guard: datasets indexed
      # under this id keep working after the FP8 swap (vectors agree to >=0.95 cosine).
      # Requires an image with alias support — v4.0.0 rejects unknown extra keys.
      alias: Qwen/Qwen3-VL-Embedding-8B
  reranker:
    name: Qwen/Qwen3-VL-Reranker-8B
    url: ''
    className: MultiModalReranker
    extra: {}
  vlm:
    name: Qwen/Qwen3.8-27B-FP8
    url: ''
    extra: {}
  asr:
    name: CohereLabs/cohere-transcribe-03-2026
    url: ''
    extra: {}
# SECRET-FIRST + STICKY (2026-09): the value already stored in the
# `<deployment.name>-model-keys` Secret wins on every upgrade; these entries
# SEED the keys on first install (or after the Secret is deleted). A values
# edit to an already-seeded key is INERT — delete the Secret first, then
# upgrade, to reseed from values. No material is ever auto-generated here.
# (Out-of-band kubectl edits hot-reload live via /etc/rag/secrets + watcher.)
modelSecrets:
  embedderApiKey: ''
  rerankerApiKey: ''
  vlmApiKey: ''
  asrApiKey: ''
modelPool:
  maxConnections: 100
  maxKeepaliveConnections: 25
s3:
  endpointUrl: http://minio.minio.svc.cluster.local:9000
  accessKeyId: ''
  secretAccessKey: ''
rag:
  ocr: false
  captionWithAsr: true
  captionWithVlm: true
  remote: false
  dedupThreshold: 0.995
  deferCountSync: true
  # Ingest-time contextual retrieval (feature: contextual retrieval).
  # false = new datasets stamp contextual:false and ingest exactly as
  # before (zero behaviour change).  true = NEW datasets are created with
  # the flag on (an explicit "contextual" in the POST /api/datasets body
  # always wins; existing datasets are untouched — PATCH or Recreate them).
  # Cost: one small LLM call per real-text chunk at ingest — review
  # POST /api/admin/datasets/{name}/contextual-preview before enabling.
  contextual: false
  # Weighted-RRF per-dataset create-time defaults (RAG_RRF_DEFAULT).
  # enabled: false = no default stamped; new datasets inherit the global
  # 1.0/1.0 (rank order unchanged).  When enabled, NEW datasets are stamped
  # dense/sparse[/k] at create time (existing datasets untouched; a body
  # "rrf" object on POST /api/datasets always wins).
  rrfDefault:
    enabled: false
    dense: 1.0
    sparse: 1.0
    k: 2
  # Unlock TTL bound (RAG_UNLOCK_MAX_TTL): 60..N seconds for explicit unlock
  # TTLs (default 86400 = the historical 24h cap).  The special value 0 opts
  # the deployment into NO-EXPIRY unlocks (ttl=0 lasts until an explicit
  # lock — the /access page's "No expiry (0)" option becomes meaningful).
  unlockMaxTtl: 86400
qdrant:
  replicas: 2
  image:
    repository: qdrant/qdrant
    tag: v1.19.0
    pullPolicy: IfNotPresent
  grpcPort: 6334
  httpPort: 6333
  client:
    preferGrpc: true
    timeout: 30
    quantization: int8
    quantizationAlwaysRam: true
  telemetryDisabled: true
redis:
  enabled: true
  image:
    repository: redis
    tag: 7-alpine
    pullPolicy: IfNotPresent
  port: 6379
  password: ''
mcp:
  enabled: true
  port: 9090
  apiKey:
    existingSecret: ""
    existingSecretKey: api-keys
  # D15 (OPT-IN) multi-user API keys → dataset ACLs. Leave BOTH empty for the
  # default single-key behaviour (nothing rendered, nothing enforced — the
  # default chart render stays byte-identical). Enabling changes the auth
  # model:
  #   apiKeyClients: "alice:s3cr3t-a;bob:s3cr3t-b"   (name:key pairs,
  #     ';'-separated; keys must not contain ':' or ';') — mints per-user keys
  #     accepted by the REST and MCP surfaces alongside the deployment keys.
  #   datasetAcls: "alice:reports,notes;bob:*"       (name:dataset[,dataset…];
  #     '*' = all datasets) — binds each name to its datasets. A registry key
  #     with NO matching ACL entry gets NO datasets (fail-closed). The plain
  #     deployment keys (security.apiKey / the MCP key set) keep FULL (admin)
  #     access. ACL'd keys cannot reach /api/admin/* nor create datasets
  #     (unless granted '*').
  # These values are KEY MATERIAL: pass them from a Secret pipeline
  # (--set-string), never commit real keys into a values file.
  apiKeyClients: ""
  datasetAcls: ""
service:
  api:
    type: ClusterIP
    port: 80
  mcp:
    type: ClusterIP
resources:
  app:
    # HPA-calibrated requests (see the autoscaling block above): the HPA's CPU
    # target reads utilization against the REQUEST, so the app request is the
    # scaling sensitivity dial — a 1.5-cpu request makes the 70% target fire
    # at ~1.05 cores of sustained per-container CPU (large-chart sibling uses
    # 2 cpu; interactive load idles at 0.2-0.5). Too low (the 500m
    # burst-to-limit attempt) read 474%+ under load and slammed the HPA to
    # maxReplicas; too high over-reserves idle pods. Memory is the scheduling
    # floor — 4Gi keeps a busy pod clear of node-pressure eviction. Limits
    # unchanged.
    requests:
      memory: 4Gi
      cpu: '1.5'
    limits:
      memory: 8Gi
      cpu: '3'
  qdrant:
    # Burst-to-limit requests (see the app block above): Qdrant returns
    # idle headroom between scale-outs. Caveat: a Qdrant pod whose working
    # set grows far past its request is a prime node-pressure eviction
    # candidate — keep an eye on headroom when collections approach the
    # PVC/memory limits. Limits are unchanged.
    requests:
      memory: 4Gi
      cpu: '1'
    limits:
      memory: 20Gi
      cpu: '6'
  redis:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 500m
antiAffinity:
  enabled: true
# Extra env vars for BOTH containers (API + MCP) — the pass-through for the
# env-only knobs: MEMORY_DATASET (the D20 anonymous grant / memory fallback),
# RAG_MEMORY_PASSWORD, INGEST_ALLOW_S3_BUCKETS (the multi-tenant bucket
# allowlist that watchedSources also obeys server-side), HTTPS_PROXY/NO_PROXY
# (hosted-trial egress), etc.
extraEnv: {}
#  extraEnv:
#    MEMORY_DATASET: "team-memory"
security:
  # REST API-key (RAG_API_KEY) + media-token HMAC secret (MEDIA_TOKEN_SECRET,
  # 64 hex): the chart ships NO key material (P0-7, 2026-09 — the previously
  # committed default literals were removed from the delivery path; the values
  # themselves are private and were NOT rotated). Sourcing precedence —
  #   1. security.existingSecret: a Secret you own provides both keys
  #      (existingSecretApiKey / existingSecretMediaTokenKey names below)
  #   2. inline value here (kept for back-compat with existing values files)
  #   3. the value already stored in the release Secret — reused on upgrade,
  #      so upgrading never rotates a secret under a running deployment
  #   4. fresh auto-generation on first install
  # Retrieve an auto-generated key: kubectl -n <ns> get secret \
  #   <deployment.name>-model-keys -o jsonpath='{.data.RAG_API_KEY}' | base64 -d
  # Rotation is OPTIONAL and operator-initiated — read helm/ROTATION.md first.
  apiKey: ''
  mediaTokenSecret: ''
  # Optional Secret (you manage it) providing both keys; when set the chart
  # renders neither key into its own Secret.
  existingSecret: ''
  existingSecretApiKey: RAG_API_KEY
  existingSecretMediaTokenKey: MEDIA_TOKEN_SECRET
  mediaTokenTtl: 3600
  ingestAllowHosts: ''
  blockPrivateHosts: true
  maxDownloadBytes: 536870912
  archiveMaxTotalBytes: 2147483648
  archiveMaxMemberBytes: 1073741824
  archiveMaxEntries: 10000
  mediaAllowPathPrefixes: /data/datasets:/data/staging
  pwMaxFailures: 10
  pwFailWindow: 300
  trustProxyIdentity: true
  # Self-service dataset selection + per-identity access store (decision D16,
  # env RAG_ACCESS_STORE).  false (default) = operator-managed ACLs only
  # (RAG_DATASET_ACLS), byte-identical behaviour.  true = registry-key users
  # manage their own dataset set on the /access page (checkboxes; protected
  # datasets demand their password once, saved per identity under
  # /data/access — the shared PVC).  Effective access = operator ACL ∪
  # selections.  Requires mcp.apiKeyClients (per-user keys) to be useful.
  accessStore: true
  # Comma-separated dataset names that can never be self-selected (D16
  # ceiling protection, env RAG_ACCESS_DENY_SELECT).  Empty = everything
  # selectable (with proof).  Read per request; rotation without restart.
  accessDenySelect: ''
  # Deployment-wide fallback memory dataset (env RAG_MEMORY_DEFAULT) — used
  # when a caller has no personal ★ binding and no client headers/env.
  # Empty = unset (the pre-existing MEMORY_DATASET env remains the fallback).
  memoryDefault: ''
  # Gate the /metrics exposition behind an API key (env RAG_METRICS_AUTH).
  # false (default) = public in-cluster exposition, unchanged behaviour.
  # true = every scrape must present X-RAG-Api-Key / X-API-Key / a Bearer key
  # (RAG_API_KEY plus the MCP key set MCP_API_KEYS / RAG_API_KEYS are all
  # accepted).
  metricsAuth: false
  # OIDC JWT as a SECOND credential for the same per-user registry identity
  # (decision D21, 2026-10; env RAG_OIDC_*).  false (default) = disabled —
  # the default render is byte-identical to the pre-D21 chart.  When true, a
  # verified JWT (RS256 against the realm JWKS; iss / aud(azp) / exp
  # validated) presented as `Authorization: Bearer <jwt>` resolves to the
  # SAME per-user registry identity as that user's minted API key (join key
  # = the identity claim, default `preferred_username`, fallback `sub`; an
  # overlay client entry may pin an explicit `"oidc": "<alias>"`).
  # Semantics (unchanged by D21): API keys stay sufficient alone and valid
  # indefinitely (rotation via the /access mint panel); JWT-only sign-in
  # WORKS — the user gets a valid registry identity with ZERO datasets
  # (fail-closed) and self-selects datasets via RAG_ACCESS_STORE (public
  # ones password-free, protected ones with their password, saved per
  # identity; ★ memory binding included).  JWT identities are NEVER admin —
  # not even when the realm token carries groups ["admin"] (a UA-realm role,
  # not a RAG grant).  Operator ACL grants apply to key and JWT alike (same
  # name); revoking/rotating one never affects the other; a `"blocked":
  # true` overlay entry kills the JWT path (401) while the key entry
  # semantics stay as today.  Issuer is REQUIRED when enabled (the app logs
  # a loud startup warning without it) — recommend the Keycloak realm URL
  # pattern https://keycloak.<your-domain>/realms/UA.  Audience is the
  # token's azp claim ("ua" on PCAI G2).
  oidc:
    enabled: false
    issuer: ''
    audience: ua
    # Claim carrying the registry identity name (fallback: `sub`).
    identityClaim: preferred_username
    # Optional explicit JWKS URL; empty = <issuer>/protocol/openid-connect/certs
    # (the Keycloak/UA-realm location; no OIDC discovery in v1).
    jwksUrl: ''
    jwksRefreshSeconds: 3600
    observedTtl: 86400
    fetchTimeoutSeconds: 3
    clockSkewSeconds: 60
    # --- Browser SSO (decision D22, 2026-10 — the Open WebUI pattern): -----
    # the app is an OIDC CLIENT: /oauth/login redirects to the realm,
    # /oauth/oidc/callback exchanges the code and plants an HttpOnly session
    # cookie (never visible to page JS).  Sessions resolve through the SAME
    # D21 registry identity.  Requires `oidc.enabled` (the D21 resolver
    # verifies the tokens) AND the client secret AND the callback URL
    # registered in the client's redirect URIs (scripts/configure-oidc-rag.sh
    # — the OWUI configure_oidc.sh pattern).  clientSecret is KEY MATERIAL:
    # prefer clientExistingSecret.
    sso:
      enabled: false
      clientId: ua
      clientSecret: ''
      # Secret carrying the client secret (key clientSecretKey) — preferred.
      clientExistingSecret: ''
      clientExistingSecretKey: clientSecret
      # Callback URL registered in the client: https://<endpoint>/oauth/oidc/callback
      redirectUri: ''
      # In-cluster discovery URL (plain HTTP — sidesteps the platform-CA TLS
      # gap; the external issuer above stays CLAIM-COMPARED only).
      providerUrl: ''
      scopes: 'openid profile email'
      cookieName: pcai-sso
      cookieMaxAgeSeconds: 43200
      cookieSecure: true
  # Identity gate on the served HTML pages (decision D23, 2026-10; env
  # RAG_SSO_GATE, read per request — flip without a restart).  false (default)
  # = byte-identical public-pages behaviour.  true = /, /manage and /access
  # require an authenticated identity (SSO session cookie / Bearer JWT /
  # API key); anonymous visitors get a minimal 401 "Sign in required" page
  # (with a link to /oauth/login when SSO is enabled).  Probes/health, the
  # oauth flow itself and media bytes stay exempt.  Enabling ONLY makes sense
  # when security.oidc.enabled or API keys are configured — an empty
  # deployment gates to nothing.
  ssoGate: false
metrics:
  serviceMonitor: false
  interval: 30s
  # When security.metricsAuth is on, name a Secret whose <key> holds a valid
  # API key; the ServiceMonitor presents it as the scrape bearer token
  # (prometheus-operator: endpoints[].bearerTokenSecret).  Empty = no token
  # on the scrape (only valid while metricsAuth stays off).
  serviceMonitorBearerSecret: ''
  serviceMonitorBearerSecretKey: RAG_API_KEY
backups:
  enabled: false
  schedule: 0 3 * * *
  bucket: ''
  retentionDays: 0
# Watched S3 sources (opt-in reconciler CronJob): on each tick the job POSTs
# every source's prefixes to POST /api/datasets/{name}/batch-urls with
# sync=true (ingest new/changed objects, prune deleted ones; unchanged objects
# are skipped via the per-dataset ETag/Size state).  Disabled by default —
# deployments without S3 render nothing.  Validation (helm template):
#   * every prefix must be an s3:// directory URL (single-object s3://file
#     URLs and http(s) URLs are rejected — sync reconciles prefixes only)
#   * every source needs a dataset name and at least one prefix
# A `type:` field is reserved for forward compatibility (SharePoint stays a
# follow-up per decision 2026-09); unknown types are rejected in v1.
watchedSources:
  enabled: false
  schedule: '*/30 * * * *'
  sources: []
  # sources:
  #   - dataset: reports
  #     prefixes:
  #       - s3://mm-rag-drop/reports/
  #   - dataset: logs
  #     prefixes:
  #       - s3://mm-rag-drop/logs/
  #       - s3://mm-rag-drop/trace-exports/
ezua:
  enabled: true
  virtualService:
    endpoint: rag-mcp-server.${DOMAIN_NAME}
    istioGateway: istio-system/ezaf-gateway
    timeout: 300s
    longTimeout: 3600s
  authorizationPolicy:
    enabled: true
    namespace: istio-system
    providerName: oauth2-proxy

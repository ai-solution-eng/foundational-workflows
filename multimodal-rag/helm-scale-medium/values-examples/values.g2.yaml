# =============================================================================
# Multimodal RAG — SE G2 deployment values (sanitized) — scale-medium chart.
#
# Variant: helm-scale-medium/  (chart rag-mcp-scale-medium: 2 API replicas x
# 2 workers, 2-shard Qdrant, Redis-backed cross-pod unlock cache).
# Choose this variant for small concurrent teams, or as the drop-in test of
# the scale architecture with a reduced resource footprint. For pilots /
# single-team use see helm/; for full throughput see helm-scale-large/.
#
# Sanitized SE-G2 deployment: real (non-secret) serving URLs and the real
# cluster domain are kept; ALL credentials are fillers. This folder is
# hardlinked to the public delivery repo — never put real credentials here.
# Real per-site values live in helm-scale-medium/local/ (gitignored +
# hardlink-ignored + never packaged).
#
# PCAI usage: import the packaged chart once, paste this whole file into the
# release's Helm Values editor, adjust the '# SITE:' lines, apply.
# Operators with cluster access may render-check first:
#   helm template <release> helm-scale-medium/ -f helm-scale-medium/values-examples/values.g2.yaml
# =============================================================================

# -- Deployment -----------------------------------------------------------------
# SITE: 2 replicas x 2 workers
replicaCount: 2

image:
  # Packaged with the chart — leave as-is unless you built your own image.
  repository: ghcr.io/ai-solution-eng/multimodal-rag-mcp
  tag: v4.4.1
  pullPolicy: IfNotPresent

deployment:
  name: rag-mcp-server
  appName: rag-mcp-server

# -- App server tuning --------------------------------------------------------------
# Each pod runs `workers` gunicorn event loops; effective concurrency =
# replicaCount * workers * syncPoolSize. Query batching folds concurrent
# text-only searches into single embedder calls.
app:
  workers: 2
  syncPoolSize: 32
  mcpPoolSize: 32
  embeddingQueryBatchSize: 128
  embeddingQueryBatchWaitMs: 200
  embeddingQueryIdleWaitMs: 50
  embeddingMaxImagesPerPrompt: 4
  qdrantQueryBatchSize: 128
  qdrantQueryBatchWaitMs: 5
  qdrantPoolSize: 16

# -- Persistence ------------------------------------------------------------------------
persistence:
  data:
    # SITE: size to the corpus (RWX storage class required)
    size: 50Gi
    storageClass: gl4f-filesystem
    accessMode: ReadWriteMany
  qdrant:
    # SITE: size to the corpus (one RWX PVC per Qdrant shard via volumeClaimTemplates)
    size: 25Gi
    storageClass: gl4f-filesystem
    accessMode: ReadWriteOnce
    mountReadOnly: false

# -- Model configuration --------------------------------------------------------------------
# The embedder is the only required endpoint; leave url "" to disable a role.
models:
  embedder:
    name: RamManavalan/Qwen3-VL-Embedding-8B-FP8
    # SITE: SE-G2 shared serving endpoints (public URLs, not secret)
    url: https://qwen3-vl-embedding-8b.project-user-andrew-bydlon.serving.pcai-se-ai-application.hst.rdlabs.hpecorp.net
    className: MultiModalEmbeddings
    extra:
      embedding_dim: 4096
      chunk_size: 2048
      chunk_overlap: 256
      code_chunk_size: 8192
      code_chunk_overlap: 512
      tokenizer_name: Qwen/Qwen3-VL-Embedding-8B
      tokenizer_type: HuggingFace
      # Same-embedder alias for the dataset fingerprint guard: datasets indexed
      # under this id keep working after the FP8 swap (vectors agree to >=0.95 cosine).
      # Requires an image with alias support — v4.0.0 rejects unknown extra keys.
      alias: Qwen/Qwen3-VL-Embedding-8B
  reranker:
    name: Qwen/Qwen3-VL-Reranker-8B
    # SITE: optional — precision at the cost of latency
    url: https://qwen3-vl-reranker-8b.project-user-andrew-bydlon.serving.pcai-se-ai-application.hst.rdlabs.hpecorp.net
    className: MultiModalReranker
    extra: {}
  vlm:
    name: Qwen/Qwen3.8-27B-FP8
    # SITE: optional — captions images/videos, converts them at query time
    url: https://qwen-38-27b.project-user-andrew-bydlon.serving.pcai-se-ai-application.hst.rdlabs.hpecorp.net
    extra: {}
  asr:
    name: CohereLabs/cohere-transcribe-03-2026
    # SITE: optional — transcribes audio + video soundtracks
    url: https://cohere-transcribe-03-2026.project-user-andrew-bydlon.serving.pcai-se-ai-application.hst.rdlabs.hpecorp.net
    extra: {}

# -- Model API keys (sensitive — fillers here) -----------------------------------------
# Rendered into the <name>-model-keys Secret (env MODEL_*_API_KEY).
# SE G2: platform JWTs for the serving endpoints — kept ONLY in helm*/local/.
modelSecrets:
  # SITE: paste the real platform JWT for each endpoint you enabled
  embedderApiKey: "<EMBEDDER_API_KEY>"
  rerankerApiKey: "<RERANKER_API_KEY>"
  vlmApiKey: "<VLM_API_KEY>"
  asrApiKey: "<ASR_API_KEY>"

# -- Model client pool ---------------------------------------------------------------------
# Raised above the single-replica default so the embedder (on every search's
# critical path) is not the bottleneck under concurrency.
modelPool:
  maxConnections: 100
  maxKeepaliveConnections: 25

# -- S3 / MinIO ----------------------------------------------------------------------------
s3:
  endpointUrl: http://minio.minio.svc.cluster.local:9000
  # SITE: fill only if the site's MinIO needs static keys (else leave "" for
  # the default boto3 credential chain)
  accessKeyId: ""
  secretAccessKey: ""

# -- RAG parameters ---------------------------------------------------------------------------
rag:
  ocr: false
  captionWithAsr: true
  captionWithVlm: true
  # Keep false on SE G2: URLs containing ".serving." are rewritten to their
  # in-cluster .svc.cluster.local form.
  remote: false
  dedupThreshold: 0.995
  # Multi-replica: do not auto-sync document counts from Qdrant on every read
  # (avoids cross-replica meta.json write races).
  deferCountSync: true
  # Ingest-time contextual retrieval (RAG_CONTEXTUAL_DEFAULT).  Keep false
  # unless the per-chunk LLM cost is understood — check
  # POST /api/admin/datasets/{name}/contextual-preview first.
  contextual: false

  # Weighted-RRF per-dataset create-time defaults (RAG_RRF_DEFAULT).
  # enabled: false = no default stamped; new datasets inherit the global
  # 1.0/1.0 (rank order unchanged).  When enabled, NEW datasets are stamped
  # dense/sparse[/k] at create time (existing datasets untouched).
  rrfDefault:
    enabled: false
    dense: 1.0
    sparse: 1.0
    k: 2

  # Unlock TTL bound (RAG_UNLOCK_MAX_TTL): caps explicit unlock TTLs on both
  # surfaces (default 86400 = the historical 24h cap; the chart default equals
  # the built-in default, so this line is informational). The special value 0
  # opts the deployment into NO-EXPIRY unlocks (ttl=0 lasts until an explicit
  # lock — the /access page's "No expiry (0)" option becomes selectable).
  unlockMaxTtl: 0
# -- Qdrant (multi-replica, built-in sharding) -----------------------------------------------
qdrant:
  # SITE: shard count
  replicas: 2
  image:
    repository: qdrant/qdrant
    tag: v1.19.0
    pullPolicy: IfNotPresent
  grpcPort: 6334
  httpPort: 6333
  # gRPC + hard timeout + int8 quantization for new collections.
  client:
    preferGrpc: true
    timeout: 30
    quantization: int8
    quantizationAlwaysRam: true
  telemetryDisabled: true

# -- Redis (cross-pod unlock cache) ---------------------------------------------------------------
# Shares dataset unlock state across API replicas so a user unlocks once.
redis:
  enabled: true
  image:
    repository: redis
    tag: 7-alpine
    pullPolicy: IfNotPresent
  port: 6379
  # SITE: optional — any random string (python -c "import secrets; print(secrets.token_urlsafe(24))")
  password: ""

# -- MCP server (sidecar) ---------------------------------------------------------------------------
mcp:
  apiKey:
    # SITE: pre-create the Secret before applying — the chart never creates
    # or inlines this key:
    #   kubectl -n <ns> create secret generic mcp-fleet-apikeys \
    #     --from-literal='api-keys=<key1>,<key2>'
    existingSecret: "mcp-fleet-apikeys"
    existingSecretKey: "api-keys"
  # D15 per-user registry keys + dataset ACLs — KEY MATERIAL (provide from a
  # Secret pipeline, never commit). Empty on this site: per-user keys are
  # minted on the /access page (D17 overlay) instead.
  apiKeyClients: ""
  datasetAcls: ""

  enabled: true
  port: 9090

# -- Service configuration -----------------------------------------------------------------------------
service:
  api:
    type: ClusterIP
    port: 80
  mcp:
    type: ClusterIP

# -- Resources ---------------------------------------------------------------------------------------------
# SITE: tune to the namespace quota
resources:
  app:
    requests:
      memory: 2.5Gi
      cpu: '1.5'
    limits:
      memory: 8Gi
      cpu: '3'
  qdrant:
    requests:
      memory: 10Gi
      cpu: '3'
    limits:
      memory: 20Gi
      cpu: '6'
  redis:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 500m

# -- Pod anti-affinity (spread replicas across nodes) ----------------------------------------------------------
antiAffinity:
  enabled: true

extraEnv: {}

# -- Security hardening ------------------------------------------------------------------------------------------
# mediaTokenSecret is REQUIRED: both the API and MCP containers refuse to
# start without it. Generate: python -c "import secrets; print(secrets.token_hex(32))"
security:
  # SITE: the chart ships NO key material (hidden 2026-09, P0-7). Replace
  # both fillers, leave '' to let the chart auto-generate per install, or
  # point security.existingSecret at a Secret you manage. Rotation is
  # OPTIONAL and operator-initiated — read helm/ROTATION.md first
  # (repo path: MultimodalRAG/helm/ROTATION.md).
  # SITE (P0-7): key material lives in a Secret YOU manage — the chart
  # renders neither RAG_API_KEY nor MEDIA_TOKEN_SECRET into its own Secret
  # when existingSecret is set; both containers read them via secretKeyRef.
  # Your Secret must carry BOTH keys (the containers refuse to start
  # without MEDIA_TOKEN_SECRET):
  #   kubectl -n <ns> create secret generic rag-platform-keys \
  #     --from-literal=RAG_API_KEY='<deployment key>' \
  #     --from-literal=MEDIA_TOKEN_SECRET='<64-hex secret>'
  # Rotation = update your Secret + roll the pods (env binds at pod start).
  existingSecret: "rag-platform-keys"
  existingSecretApiKey: RAG_API_KEY
  existingSecretMediaTokenKey: MEDIA_TOKEN_SECRET
  mediaTokenTtl: 3600
  ingestAllowHosts: ''
  blockPrivateHosts: true
  maxDownloadBytes: 536870912
  archiveMaxTotalBytes: 2147483648
  archiveMaxMemberBytes: 1073741824
  archiveMaxEntries: 10000
  mediaAllowPathPrefixes: /data/datasets:/data/staging
  pwMaxFailures: 10
  pwFailWindow: 300
  # true is correct on SE G2 / hosted trials: an enforcing auth proxy
  # (oauth2-proxy) overwrites the identity headers on every request.
  trustProxyIdentity: true

  # Self-service dataset selection (decision D16, env RAG_ACCESS_STORE) —
  # off here. With accessStore: true AND per-user keys minted (mcp.apiKeyClients
  # in helm/values.yaml), registry-key users manage their own dataset set on the
  # /access page: every key sees all dataset names, selects what it needs
  # (protected datasets demand their password once — saved per identity under
  # /data/access), and stars its memory dataset server-side. Effective access =
  # operator ACL (mcp.datasetAcls) ∪ selections.
  accessStore: true
  # Datasets that can never be self-selected (comma-separated; renders only
  # when non-empty). Empty = everything selectable with proof.
  accessDenySelect: ''
  # Deployment-wide fallback memory dataset (RAG_MEMORY_DEFAULT) for callers
  # without a personal ★ binding. Empty = unset.
  memoryDefault: ''
  # REST/MCP key + media-token HMAC secret — empty here because
  # security.existingSecret above supplies both (set these ONLY as a
  # back-compat alternative when no Secret is managed).
  apiKey: ''
  mediaTokenSecret: ''
  # Gate /metrics behind an API key (env RAG_METRICS_AUTH) — keep false here:
  # in-cluster Prometheus scrapes the exposition without a token. (When
  # enabling, also set metrics.serviceMonitorBearerSecret so the scraper
  # presents the key as its bearer token.)
  metricsAuth: false

# -- Metrics (optional) -----------------------------------------------------------------------------------------------
metrics:
  serviceMonitor: false
  interval: 30s
  # When security.metricsAuth is on, name a Secret whose <key> holds a valid
  # API key; the ServiceMonitor presents it as the scrape bearer token (same
  # keys as the base chart). Empty = no token on the scrape.
  serviceMonitorBearerSecret: ''
  serviceMonitorBearerSecretKey: RAG_API_KEY

# -- Backups (optional) ---------------------------------------------------------------------------------------------------
backups:
  enabled: false
  schedule: 0 3 * * *
  bucket: ''
  retentionDays: 0

# -- Watched S3 sources (optional) -----------------------------------------------------------------------------------------------
# Opt-in reconciler CronJob: every tick, POST each source's s3:// prefixes to
# /api/datasets/{dataset}/batch-urls with sync=true — new/changed objects are
# ingested, objects deleted upstream are pruned, unchanged objects are skipped
# via the per-dataset ETag/Size state (files/.watched_state.json).  Prefixes
# must be s3:// directory URLs (validated at render time).  Disabled by
# default renders nothing.
watchedSources:
  enabled: false
  schedule: '*/30 * * * *'
  sources: []
  # sources:
  #   - dataset: reports
  #     prefixes:
  #       - s3://mm-rag-drop/reports/

# -- PCAI (HPE Ezmeral Unified Analytics) integration -----------------------------------------------------------------------
ezua:
  enabled: true
  virtualService:
    # SITE: SE-G2 cluster domain (literal — or use rag-mcp-server.${DOMAIN_NAME})
    endpoint: rag-mcp-server.pcai-se-ai-application.hst.rdlabs.hpecorp.net
    istioGateway: istio-system/ezaf-gateway
    timeout: 300s
    longTimeout: 3600s
  authorizationPolicy:
    # SITE: false on SE G2 — the ezaf-gateway applies HPE SSO centrally, so the
    # chart does not create its own AuthorizationPolicy. Set true (+ provider
    # oauth2-proxy) on customer PCAI clusters.
    enabled: false
    namespace: istio-system
    providerName: oauth2-proxy

# =============================================================================
# Multimodal RAG — SE G2 deployment values (sanitized) — scale-medium chart.
# Variant: helm-scale-medium/ (rag-mcp-scale-medium: 2 API replicas x 2
# workers, 2-shard Qdrant, Redis-backed cross-pod unlock cache) — small
# concurrent teams / the drop-in test of the scale architecture at reduced
# footprint.  Pilots: helm/;  full throughput: helm-scale-large/.
# Sanitized SE-G2 deployment: real (non-secret) serving URLs + cluster domain;
# ALL credentials are fillers (folder hardlinked to the public repo — never
# add real credentials); real per-site values live in helm-scale-medium/local/
# (gitignored + never packaged).
# PCAI usage: import the packaged chart once, paste this whole file into the
# release's Helm Values editor, apply.
# Operators with cluster access may render-check first:
# helm template <release> helm-scale-medium/ -f helm-scale-medium/values-examples/values.g2.yaml
# =============================================================================
# ============================================================================
#
# ### REQUIRED ### — key material lives in Secrets you own, NOT in values
# (missing Secret = CreateContainerError; every key the Secret carries
# overrides the values seeds below it).
#   1. modelSecrets.existingSecret — the broad secret: MODEL_*_API_KEY per
#      enabled role, optionally MODEL_*_URL / S3_* / REDIS_PASSWORD
#   2. models.embedder.url — reachable embedder endpoint (startup ABORTS if
#      unreachable) unless the Secret carries MODEL_EMBEDDER_URL
#   3. security.existingSecret — RAG_API_KEY + MEDIA_TOKEN_SECRET
#   4. ezua.virtualService.endpoint — RENDER FAILS without it while ezua.enabled
# 2 replicas x 2 workers

# ============================================================================
# Image / Scaling
# ============================================================================

deployment:
  name: rag-mcp-server
  appName: rag-mcp-server

# Concurrency = replicaCount * workers * syncPoolSize (gunicorn event loops);
# query batching folds concurrent text-only searches into one embedder call.

replicaCount: 2

image:
  # Packaged with the chart — leave as-is unless you built your own image.
  repository: ghcr.io/ai-solution-eng/multimodal-rag-mcp
  tag: v5.7.0
  pullPolicy: IfNotPresent

qdrant:
  replicas: 2
  image:
    repository: qdrant/qdrant
    tag: v1.19.0
    pullPolicy: IfNotPresent
  grpcPort: 6334
  httpPort: 6333
  # gRPC + hard timeout + int8 quantization for new collections.
  client:
    preferGrpc: true
    timeout: 30
    quantization: int8
    quantizationAlwaysRam: true
  telemetryDisabled: true

# Shares dataset unlock state across API replicas so a user unlocks once.
redis:
  enabled: true
  image:
    repository: redis
    tag: 7-alpine
    pullPolicy: IfNotPresent
  port: 6379
  password: ""

# ============================================================================
# Resources
# ============================================================================

resources:
  app:
    # HPA-calibrated: the HPA CPU target reads utilization against the
    # request — 1.5 cpu puts the 70% target at ~1.05 cores sustained.
    requests: {cpu: '1.5', memory: 4Gi}
    limits: {cpu: '3', memory: 8Gi}
  qdrant:
    requests: {cpu: '3', memory: 10Gi}
    limits: {cpu: '6', memory: 20Gi}
  redis:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: 500m, memory: 512Mi}

persistence:
  data:
    size: 50Gi
    storageClass: gl4f-filesystem
    accessMode: ReadWriteMany
  qdrant:
    size: 25Gi
    storageClass: gl4f-filesystem
    accessMode: ReadWriteOnce
    mountReadOnly: false

# The embedder is the only required endpoint; leave url "" to disable a role.

# ============================================================================
# App Parallelism
# ============================================================================

# Concurrency = replicaCount * workers * syncPoolSize (gunicorn event loops);
# query batching folds concurrent text-only searches into one embedder call.
app:
  workers: 2
  syncPoolSize: 32
  mcpPoolSize: 32
  embeddingQueryBatchSize: 128
  embeddingQueryBatchWaitMs: 200
  embeddingQueryIdleWaitMs: 50
  embeddingMaxImagesPerPrompt: 4
  qdrantQueryBatchSize: 128
  qdrantQueryBatchWaitMs: 5
  qdrantPoolSize: 16

# Above the single-replica default so the embedder (on every search's critical
# path) is not the concurrency bottleneck.
modelPool:
  maxConnections: 100
  maxKeepaliveConnections: 25

# ============================================================================
# Secrets
# ============================================================================

# The embedder is the only required endpoint; leave url "" to disable a role.
models:
  embedder:
    name: RamManavalan/Qwen3-VL-Embedding-8B-FP8
    url: https://qwen3-vl-embedding-8b.project-user-andrew-bydlon.serving.${DOMAIN_NAME}
    className: MultiModalEmbeddings
    extra:
      embedding_dim: 4096
      chunk_size: 2048
      chunk_overlap: 256
      code_chunk_size: 8192
      code_chunk_overlap: 512
      tokenizer_name: Qwen/Qwen3-VL-Embedding-8B
      tokenizer_type: HuggingFace
      # Fingerprint-guard alias: datasets indexed under the old id survive the
      # FP8 swap (>=0.95 cosine); requires an alias-capable image (v4.0.0 rejects unknown extra keys).
      alias: Qwen/Qwen3-VL-Embedding-8B
  reranker:
    name: Qwen/Qwen3-VL-Reranker-8B
    # optional — precision at the cost of latency
    url: https://qwen3-vl-reranker-8b.project-user-andrew-bydlon.serving.${DOMAIN_NAME}
    className: MultiModalReranker
    extra: {}
  vlm:
    name: Qwen/Qwen3.8-27B-FP8
    # optional — captions images/videos, converts them at query time
    url: https://qwen-38-27b.project-user-andrew-bydlon.serving.${DOMAIN_NAME}
    extra: {}
  asr:
    name: CohereLabs/cohere-transcribe-03-2026
    # optional — transcribes audio + video soundtracks
    url: https://cohere-transcribe-03-2026.project-user-andrew-bydlon.serving.${DOMAIN_NAME}
    extra: {}

# Rendered into the <name>-model-keys Secret (env MODEL_*_API_KEY).
# SE G2: platform JWTs for the serving endpoints — kept ONLY in helm*/local/.
modelSecrets:
  # Broadest-secret mode: one Secret you own carries MODEL_*_API_KEY (+ optional
  # MODEL_*_URL, S3_*, REDIS_PASSWORD) — build from helm/local/secrets.template.yaml.
  existingSecret: ""
  embedderApiKey: "<EMBEDDER_API_KEY>"
  rerankerApiKey: "<RERANKER_API_KEY>"
  vlmApiKey: "<VLM_API_KEY>"
  asrApiKey: "<ASR_API_KEY>"

# Above the single-replica default so the embedder (on every search's critical
# path) is not the concurrency bottleneck.

# ============================================================================
# App Defaults
# ============================================================================

rag:
  ocr: false
  captionWithAsr: true
  captionWithVlm: true
  # Keep false on SE G2: ".serving." URLs rewrite to in-cluster.svc.cluster.local.
  remote: false
  dedupThreshold: 0.995
  # Multi-replica: do not auto-sync document counts from Qdrant on every read
  # (avoids cross-replica meta.json write races).
  deferCountSync: true
  # Ingest-time contextual retrieval (RAG_CONTEXTUAL_DEFAULT).  Keep false
  # unless the per-chunk LLM cost is understood — check
  # POST /api/admin/datasets/{name}/contextual-preview first.
  contextual: false

  # Weighted-RRF per-dataset create-time defaults (RAG_RRF_DEFAULT).
  # enabled: false = no default stamped; new datasets inherit the global
  # 1.0/1.0 (rank order unchanged).  When enabled, NEW datasets are stamped
  # dense/sparse[/k] at create time (existing datasets untouched).
  rrfDefault:
    enabled: false
    dense: 1.0
    sparse: 1.0
    k: 2

  # Unlock TTL bound (RAG_UNLOCK_MAX_TTL; 86400 here = the built-in default,
  # informational).  0 = NO-EXPIRY unlocks (the "No expiry (0)" option).
  unlockMaxTtl: 0

mcp:
  apiKey:
    # pre-create first — the chart never creates/inlines this key:
    # kubectl -n <ns> create secret generic mcp-fleet-apikeys \
    # --from-literal='api-keys=<key1>,<key2>'
    existingSecret: "mcp-fleet-apikeys"
    existingSecretKey: "api-keys"
  # per-user keys + ACLs — KEY MATERIAL (Secret pipeline; never commit).
  # Empty on this site: per-user keys are minted on /access ( overlay).
  apiKeyClients: ""
  datasetAcls: ""

  enabled: true
  port: 9090

antiAffinity:
  enabled: true

extraEnv: {}

# ============================================================================
# Security
# ============================================================================

# mediaTokenSecret is REQUIRED: both the API and MCP containers refuse to
# start without it. Generate: python -c "import secrets; print(secrets.token_hex(32))"
security:
  # the chart ships NO key material — it lives in a
  # Secret YOU manage (both containers read it via secretKeyRef and refuse to
  # start without MEDIA_TOKEN_SECRET):
  # kubectl -n <ns> create secret generic rag-platform-keys \
  # --from-literal=RAG_API_KEY='<deployment key>' \
  # --from-literal=MEDIA_TOKEN_SECRET='<64-hex secret>'
  # (Alternative: replace the fillers, or leave '' to auto-generate per
  # install.)  Rotation = update the Secret + roll the pods; runbook:
  # MultimodalRAG/helm/ROTATION.md.
  existingSecret: "rag-platform-keys"
  existingSecretApiKey: RAG_API_KEY
  existingSecretMediaTokenKey: MEDIA_TOKEN_SECRET
  mediaTokenTtl: 3600
  ingestAllowHosts: ''
  blockPrivateHosts: true
  maxDownloadBytes: 536870912
  archiveMaxTotalBytes: 2147483648
  archiveMaxMemberBytes: 1073741824
  archiveMaxEntries: 10000
  mediaAllowPathPrefixes: /data/datasets:/data/staging
  pwMaxFailures: 10
  pwFailWindow: 300
  # true: an enforcing auth proxy (oauth2-proxy / ezaf-gateway) overwrites the
  # identity headers on every request.
  trustProxyIdentity: true

  # self-service selection (env RAG_ACCESS_STORE) — ON this site: users
  # manage their own dataset set on /access (protected ones demand their
  # password once — saved per identity; ★ memory binding).  Effective access =
  # operator ACL ∪ selections (per-user keys: mcp.apiKeyClients or the page).
  accessStore: true
  # ceiling: comma-separated datasets that can never be self-selected.
  accessDenySelect: ''
  accessSelfMint: true   # ezaf-gateway proxy identities mint/rotate their own key on the Access page
  # Fallback memory dataset (RAG_MEMORY_DEFAULT) for callers without a ★ binding.
  memoryDefault: ''
  # Empty: security.existingSecret above supplies both (inline = back-compat only).
  apiKey: ''
  mediaTokenSecret: ''
  # Keep false: in-cluster Prometheus scrapes without a token.  If true, also
  # set metrics.serviceMonitorBearerSecret (the scraper's bearer token).
  metricsAuth: false
  oidc:
    enabled: true
    issuer: "https://keycloak.${DOMAIN_NAME}/realms/UA"
    audience: ua
    identityClaim: preferred_username
    # In-cluster Keycloak headless service (plain HTTP inside the mesh).
    jwksUrl: "http://keycloak-headless.keycloak.svc.cluster.local:8080/realms/UA/protocol/openid-connect/certs"
    jwksRefreshSeconds: 3600
    observedTtl: 86400
    fetchTimeoutSeconds: 3
    clockSkewSeconds: 60

    platformCa:
      configMapName: ezaf-root-ca
      configMapKey: ezaf-root-ca.crt

    sso:
      enabled: true
      clientId: ua
      # Substituted by the PCAI values editor at deploy time.
      clientSecret: "${OIDC_CLIENT_SECRET}"
      clientExistingSecret: ""
      clientExistingSecretKey: clientSecret
      redirectUri: "https://rag-mcp-server.${DOMAIN_NAME}/oauth/oidc/callback"
      providerUrl: "https://keycloak.${DOMAIN_NAME}/realms/UA/.well-known/openid-configuration"
      scopes: "openid profile email"
      cookieName: pcai-sso
      cookieMaxAgeSeconds: 43200
      cookieSecure: true
  ssoGate: false

metrics:
  serviceMonitor: false
  interval: 30s
  # With metricsAuth on: the Secret/key the ServiceMonitor presents as its
  # scrape bearer token (same keys as the base chart).
  serviceMonitorBearerSecret: ''
  serviceMonitorBearerSecretKey: RAG_API_KEY

# ============================================================================
# S3 Related
# ============================================================================

s3:
  endpointUrl: http://minio.minio.svc.cluster.local:9000
  accessKeyId: ""
  secretAccessKey: ""

backups:
  enabled: false
  schedule: 0 3 * * *
  bucket: ''
  retentionDays: 0

# Opt-in reconciler CronJob: each tick POSTs the prefixes to batch-urls with
# sync=true (new/changed ingest, deleted prune, unchanged skip via the
# ETag/Size state; s3:// directory URLs validated at render time).  Off by
# default — renders nothing.
watchedSources:
  enabled: false
  schedule: '*/30 * * * *'
  sources: []
  # sources:
  # - dataset: reports
  # prefixes:
  # - s3://mm-rag-drop/reports/

# ============================================================================
# PCAI Networking
# ============================================================================

service:
  api:
    type: ClusterIP
    port: 80
  mcp:
    type: ClusterIP

ezua:
  enabled: true
  virtualService:
    endpoint: rag-mcp-server.${DOMAIN_NAME}
    istioGateway: istio-system/ezaf-gateway
    timeout: 300s
    longTimeout: 3600s
  authorizationPolicy:
    enabled: true
    namespace: istio-system
    providerName: oauth2-proxy

# ============================================================================
# Multimodal RAG — helm-scale-medium/ chart values (rag-mcp-scale-medium: 2 API
# replicas x 2 workers, 2-shard Qdrant, Redis cross-pod unlock cache).
# Full guide: documentation/DEPLOYMENT.md + documentation/SCALE.md.
# ============================================================================

# ### REQUIRED ### — key material lives in Secrets you own, NOT in values
# (build from helm/local/secrets.template.yaml; missing Secret = CreateContainerError;
# every key the Secret carries overrides the values seeds below it).
#   1. modelSecrets.existingSecret — the broad secret: MODEL_*_API_KEY per enabled
#      role, optionally MODEL_*_URL / S3_* / REDIS_PASSWORD (one object, everything).
#   2. models.embedder.url — reachable embedder endpoint (startup ABORTS if
#      unreachable) unless the Secret carries MODEL_EMBEDDER_URL.
#   3. security.existingSecret — RAG_API_KEY + MEDIA_TOKEN_SECRET.
#      Rotation runbook: helm/ROTATION.md.
#   4. ezua.virtualService.endpoint — RENDER FAILS without it while ezua.enabled.

# ### OPTIONAL ###
# Major tuning setups (copy the shape from the pointer):
#   Scaling: replicaCount / qdrant.replicas / app.workers — SCALE.md §12
#   SSO / identity stack: security.oidc.* / oidc.sso.* / ssoGate / accessSelfMint — §5b
#   Storage: s3.* / backups.* / watchedSources.* (each source REQUIRES dataset + >=1 prefix) — §2 + §7b
#   Multi-user keys + access store: mcp.apiKeyClients / mcp.datasetAcls / security.accessStore — §2
#   MCP API-key gate: mcp.apiKey.existingSecret (pre-create the Secret) — §2
#   Metrics: metrics.serviceMonitor (+ bearer Secret when security.metricsAuth) — §2
#   Optional model roles: models.reranker / vlm / asr (url "" disables) — §2
#   RAG pipeline: rag.ocr / rag.contextual / rag.rrfDefault — §2

# Sanitized SE-G2 example: real (non-secret) serving URLs and cluster domain; ALL
# credentials are fillers — never add real ones (hardlinked to the public repo).

# Drop-in test of the scale architecture at reduced footprint: pilots in helm/,
# full throughput in helm-scale-large/. Import the chart, paste this whole file
# into the PCAI release's Helm Values editor, apply.

deployment:
  name: rag-mcp-server
  appName: rag-mcp-server

replicaCount: 2

image:
  # Packaged with the chart — leave as-is unless you built your own image.
  repository: ghcr.io/ai-solution-eng/multimodal-rag-mcp
  tag: v5.8.2
  pullPolicy: IfNotPresent

qdrant:
  replicas: 2
  image:
    repository: qdrant/qdrant
    tag: v1.19.0
    pullPolicy: IfNotPresent
  grpcPort: 6334
  httpPort: 6333
  # gRPC + hard timeout + int8 quantization for new collections.
  client:
    preferGrpc: true
    timeout: 30
    quantization: int8
    quantizationAlwaysRam: true
  telemetryDisabled: true

# Shares dataset unlock state across API replicas so a user unlocks once.
redis:
  enabled: true
  image:
    repository: redis
    tag: 7-alpine
    pullPolicy: IfNotPresent
  port: 6379
  password: ""

# ============================================================================
# Resources
# ============================================================================

resources:
  app:
    requests: {cpu: '1.5', memory: 4Gi}
    limits: {cpu: '3', memory: 8Gi}

  qdrant:
    requests: {cpu: '3', memory: 10Gi}
    limits: {cpu: '6', memory: 20Gi}

  redis:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: 500m, memory: 512Mi}

persistence:
  data:
    size: 50Gi
    storageClass: gl4f-filesystem
    accessMode: ReadWriteMany

  qdrant:
    size: 25Gi
    storageClass: gl4f-filesystem
    accessMode: ReadWriteOnce
    mountReadOnly: false

# The embedder is the only required endpoint; leave url "" to disable a role.

# ============================================================================
# App Parallelism
# ============================================================================

app:
  workers: 2
  syncPoolSize: 32
  mcpPoolSize: 32
  embeddingQueryBatchSize: 128
  embeddingQueryBatchWaitMs: 200
  embeddingQueryIdleWaitMs: 50
  embeddingMaxImagesPerPrompt: 4
  qdrantQueryBatchSize: 128
  qdrantQueryBatchWaitMs: 5
  qdrantPoolSize: 16

# Above the single-replica default so the embedder (on every search's critical
# path) is not the concurrency bottleneck.
modelPool:
  maxConnections: 100
  maxKeepaliveConnections: 25

# ============================================================================
# Secrets
# ============================================================================

# The embedder is the only required endpoint; leave url "" to disable a role.
models:
  embedder:
    name: RamManavalan/Qwen3-VL-Embedding-8B-FP8
    url: https://qwen3-vl-embedding-8b.project-user-andrew-bydlon.serving.${DOMAIN_NAME}
    className: MultiModalEmbeddings
    extra:
      embedding_dim: 4096
      chunk_size: 2048
      chunk_overlap: 256
      code_chunk_size: 8192
      code_chunk_overlap: 512
      tokenizer_name: Qwen/Qwen3-VL-Embedding-8B
      tokenizer_type: HuggingFace
      # Datasets indexed under this id keep working after the FP8 swap.
      alias: Qwen/Qwen3-VL-Embedding-8B

  reranker:
    name: Qwen/Qwen3-VL-Reranker-8B
    # optional — precision at the cost of latency
    url: https://qwen3-vl-reranker-8b.project-user-andrew-bydlon.serving.${DOMAIN_NAME}
    className: MultiModalReranker
    extra: {}

  vlm:
    name: Qwen/Qwen3.8-27B-FP8
    # optional — captions images/videos, converts them at query time
    url: https://qwen-38-27b.project-user-andrew-bydlon.serving.${DOMAIN_NAME}
    extra: {}

  asr:
    name: CohereLabs/cohere-transcribe-03-2026
    # optional — transcribes audio + video soundtracks
    url: https://cohere-transcribe-03-2026.project-user-andrew-bydlon.serving.${DOMAIN_NAME}
    extra: {}

# API keys land in the chart's Kubernetes Secret, not the ConfigMap — never commit real keys.
modelSecrets:
  # Broadest-secret mode: one Secret you own carries MODEL_*_API_KEY (+ S3_*, REDIS_PASSWORD).
  existingSecret: ""
  embedderApiKey: "<EMBEDDER_API_KEY>"
  rerankerApiKey: "<RERANKER_API_KEY>"
  vlmApiKey: "<VLM_API_KEY>"
  asrApiKey: "<ASR_API_KEY>"

# ============================================================================
# App Defaults
# ============================================================================

rag:
  ocr: false
  captionWithAsr: true
  captionWithVlm: true
  # false = ".serving." URLs are rewritten to in-cluster .svc form.
  remote: false
  dedupThreshold: 0.995
  # true = document_count is NOT re-synced from Qdrant on every read (admin sync only).
  deferCountSync: true
  contextual: false

  # Stamps dense/sparse[/k] on NEW datasets at create time; existing ones are untouched.
  rrfDefault:
    enabled: false
    dense: 1.0
    sparse: 1.0
    k: 2

  # Caps explicit unlock TTLs; 0 = the /access "No expiry (0)" option becomes selectable.
  unlockMaxTtl: 0

mcp:
  apiKey:
  # API-key gate: a Secret whose key holds the comma-separated key list; empty = /mcp runs open.
  # kubectl -n <ns> create secret generic mcp-fleet-apikeys \
  # --from-literal='api-keys=<key1>,<key2>'
    existingSecret: "mcp-fleet-apikeys"
    existingSecretKey: "api-keys"
  # Per-user keys + dataset ACLs — key material; provide from a Secret pipeline.
  apiKeyClients: ""
  datasetAcls: ""

  enabled: true
  port: 9090

antiAffinity:
  enabled: true

extraEnv: {}

# ============================================================================
# Security
# ============================================================================

# `mediaTokenSecret` is REQUIRED: both containers refuse to start without it.
security:
  # kubectl -n <ns> create secret generic rag-platform-keys \
  # --from-literal=RAG_API_KEY='<deployment key>' \
  # --from-literal=MEDIA_TOKEN_SECRET='<64-hex secret>'
  existingSecret: "rag-platform-keys"
  existingSecretApiKey: RAG_API_KEY
  existingSecretMediaTokenKey: MEDIA_TOKEN_SECRET
  mediaTokenTtl: 3600
  ingestAllowHosts: ''
  blockPrivateHosts: true
  maxDownloadBytes: 536870912
  archiveMaxTotalBytes: 2147483648
  archiveMaxMemberBytes: 1073741824
  archiveMaxEntries: 10000
  mediaAllowPathPrefixes: /data/datasets:/data/staging
  pwMaxFailures: 10
  pwFailWindow: 300
  # Trust X-Auth-Request-*/X-Email/X-User headers; keep true ONLY behind an enforcing auth proxy.
  trustProxyIdentity: true

  # Self-service dataset selection + ★ memory binding on /access; needs mcp.apiKeyClients.
  accessStore: true
  accessDenySelect: ''
  accessSelfMint: true   # ezaf-gateway proxy identities mint/rotate their own key on the Access page
  memoryDefault: ''
  apiKey: ''
  mediaTokenSecret: ''
  # Gate /metrics behind an API key (false = public in-cluster exposition).
  metricsAuth: false
  oidc:
    enabled: true
    issuer: "https://keycloak.${DOMAIN_NAME}/realms/UA"
    audience: ua
    identityClaim: preferred_username
    jwksUrl: "http://keycloak-headless.keycloak.svc.cluster.local:8080/realms/UA/protocol/openid-connect/certs"
    jwksRefreshSeconds: 3600
    observedTtl: 86400
    fetchTimeoutSeconds: 3
    clockSkewSeconds: 60

    platformCa:
      configMapName: ezaf-root-ca
      configMapKey: ezaf-root-ca.crt

    sso:
      enabled: true
      clientId: ua
      clientSecret: "${OIDC_CLIENT_SECRET}"
      clientExistingSecret: ""
      clientExistingSecretKey: clientSecret
      redirectUri: "https://rag-mcp-server.${DOMAIN_NAME}/oauth/oidc/callback"
      providerUrl: "https://keycloak.${DOMAIN_NAME}/realms/UA/.well-known/openid-configuration"
      scopes: "openid profile email"
      cookieName: pcai-sso
      cookieMaxAgeSeconds: 43200
      cookieSecure: true
  ssoGate: false

metrics:
  serviceMonitor: false
  interval: 30s
  # Name a Secret holding a valid API key for prometheus-operator scraping; empty = no token.
  serviceMonitorBearerSecret: ''
  serviceMonitorBearerSecretKey: RAG_API_KEY

# ============================================================================
# S3 Related
# ============================================================================

s3:
  endpointUrl: http://minio.minio.svc.cluster.local:9000
  accessKeyId: ""
  secretAccessKey: ""

backups:
  enabled: false
  schedule: 0 3 * * *
  bucket: ''
  retentionDays: 0

# Opt-in reconciler CronJob: each tick POSTs each source's s3:// prefixes to
# batch-urls — new/changed objects ingest, deleted ones are pruned.
watchedSources:
  enabled: false
  schedule: '*/30 * * * *'
  sources: []

# ============================================================================
# PCAI Networking
# ============================================================================

service:
  api:
    type: ClusterIP
    port: 80

  mcp:
    type: ClusterIP

ezua:
  enabled: true
  virtualService:
    endpoint: rag-mcp-server.${DOMAIN_NAME}
    istioGateway: istio-system/ezaf-gateway
    timeout: 300s
    longTimeout: 3600s

  authorizationPolicy:
    enabled: true
    namespace: istio-system
    providerName: oauth2-proxy

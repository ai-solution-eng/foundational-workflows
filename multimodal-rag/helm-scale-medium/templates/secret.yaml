{{- /*
  REST API key (RAG_API_KEY) + media-token HMAC secret (MEDIA_TOKEN_SECRET)
  sourcing — highest precedence first:
    1. security.existingSecret: a Secret YOU own provides both keys
       (security.existingSecretApiKey / existingSecretMediaTokenKey); this
       chart's Secret renders neither key, and the deployment wires both env
       vars from your Secret via secretKeyRef.
    2. security.apiKey / security.mediaTokenSecret set inline: used verbatim
       (back-compat with pre-2026-09 values files).
    3. lookup of this chart's own Secret: on `helm upgrade` the values from
       the previous install are REUSED, so upgrading never rotates a secret
       underneath the running deployment.
    4. nothing found: fresh values are generated on first install (32-char
       API key; 64-hex media-token secret).
  The chart repository ships no key material (P0-7, 2026-09). The values
  are private; rotation is OPTIONAL — read helm/ROTATION.md first.

  ── Model / S3 / Redis keys — SECRET-FIRST, sticky (2026-09) ──────────────
  modelSecrets.*, s3.* and redis.password follow the OPPOSITE flow of the
  REST keys above: the value already stored in the release Secret WINS, and
  the values entries are the SEED.
    1. First install (or after this Secret is deleted): values seed the keys.
    2. Every later upgrade: stored values are reused — an upgrade never
       clobbers a key rotated out-of-band (`kubectl edit secret` also works
       and hot-reloads live: the /etc/rag/secrets file mount updates ~1s and
       the containers' CONFIG_DIR watcher rebuilds the model objects ≤15s,
       no rollout).
    3. Consequence: a values-file edit to an ALREADY-SEEDED key is INERT.
       To reseed from values, delete the Secret first, then upgrade:
         kubectl -n <ns> delete secret <deployment.name>-model-keys
         helm upgrade <release> <chart> ...   # values reseed the keys
       (pods restarted inside the delete→upgrade window may report
       CreateContainerConfigError until the upgrade recreates the Secret.)
  An empty rendered value keeps each key's documented fallback (boto3
  default chain for S3_*; unauthenticated Redis for REDIS_PASSWORD).
*/ -}}
{{- $secName := printf "%s-model-keys" .Values.deployment.name -}}
{{- $useExisting := false -}}
{{- if .Values.security.existingSecret -}}
{{-   $useExisting = true -}}
{{- end -}}
{{- /* Stored (sticky) values from the release Secret — read once, used by
       BOTH the model/s3/redis keys and (below) the REST keys. */ -}}
{{- $stored := dict -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secName -}}
{{- if $existing -}}
{{-   $stored = $existing.data | default dict -}}
{{- end -}}
{{- $mEmbedder := get $stored "MODEL_EMBEDDER_API_KEY" | default "" | b64dec | default .Values.modelSecrets.embedderApiKey | default "" -}}
{{- $mReranker := get $stored "MODEL_RERANKER_API_KEY" | default "" | b64dec | default .Values.modelSecrets.rerankerApiKey | default "" -}}
{{- $mVlm := get $stored "MODEL_VLM_API_KEY" | default "" | b64dec | default .Values.modelSecrets.vlmApiKey | default "" -}}
{{- $mAsr := get $stored "MODEL_ASR_API_KEY" | default "" | b64dec | default .Values.modelSecrets.asrApiKey | default "" -}}
{{- $s3Id := get $stored "S3_ACCESS_KEY_ID" | default "" | b64dec | default .Values.s3.accessKeyId | default "" -}}
{{- $s3Key := get $stored "S3_SECRET_ACCESS_KEY" | default "" | b64dec | default .Values.s3.secretAccessKey | default "" -}}
{{- $redisPw := get $stored "REDIS_PASSWORD" | default "" | b64dec | default .Values.redis.password | default "" -}}
{{- $apiKey := "" -}}
{{- $mediaTokenSecret := "" -}}
{{- if not $useExisting -}}
{{-   $prevApi := get $stored "RAG_API_KEY" | default "" | b64dec -}}
{{-   $prevTok := get $stored "MEDIA_TOKEN_SECRET" | default "" | b64dec -}}
{{-   $apiKey = .Values.security.apiKey | default $prevApi | default (randAlphaNum 32) -}}
{{-   $mediaTokenSecret = .Values.security.mediaTokenSecret | default $prevTok | default (randAlphaNum 32 | sha256sum) -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.deployment.appName }}
type: Opaque
stringData:
  # Secret-first, sticky: stored value wins; values seed first install.
  # Values edits to seeded keys are inert — delete this Secret to reseed
  # from values (see file header + helm/ROTATION.md).
  MODEL_EMBEDDER_API_KEY: {{ $mEmbedder | quote }}
  MODEL_RERANKER_API_KEY: {{ $mReranker | quote }}
  MODEL_VLM_API_KEY: {{ $mVlm | quote }}
  MODEL_ASR_API_KEY: {{ $mAsr | quote }}
  # S3 / MinIO access credentials (optional — empty = default boto3 chain).
  S3_ACCESS_KEY_ID: {{ $s3Id | quote }}
  S3_SECRET_ACCESS_KEY: {{ $s3Key | quote }}
  {{- if not $useExisting }}
  # REST API-key auth + shared media-token HMAC secret — never shipped in
  # the chart: inline back-compat value, reuse of the previously released
  # value, or first-install generation (see header; helm/ROTATION.md).
  RAG_API_KEY: {{ $apiKey | quote }}
  MEDIA_TOKEN_SECRET: {{ $mediaTokenSecret | quote }}
  {{- end }}
  # Redis unlock-cache auth (scale charts; empty = unauthenticated).
  REDIS_PASSWORD: {{ $redisPw | quote }}

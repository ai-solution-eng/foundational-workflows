apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.deployment.name }}-qdrant
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.deployment.name }}-qdrant
spec:
  serviceName: {{ .Values.deployment.name }}-qdrant
  replicas: {{ .Values.qdrant.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.deployment.name }}-qdrant
  template:
    metadata:
      labels:
        app: {{ .Values.deployment.name }}-qdrant
    spec:
      containers:
        - name: qdrant
          image: "{{ .Values.qdrant.image.repository }}:{{ .Values.qdrant.image.tag }}"
          imagePullPolicy: {{ .Values.qdrant.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              ORDINAL="${POD_NAME##*-}"
              SVC="{{ .Values.deployment.name }}-qdrant"
              if [ "$ORDINAL" = "0" ]; then
                echo "Starting first Qdrant peer (bootstraps new cluster)"
                exec /qdrant/qdrant --uri "http://${POD_NAME}.${SVC}:6335/"
              else
                echo "Joining existing Qdrant cluster via ${SVC}-0"
                exec /qdrant/qdrant --bootstrap "http://${SVC}-0.${SVC}:6335/" --uri "http://${POD_NAME}.${SVC}:6335/"
              fi
          env:
            - name: QDRANT__CLUSTER__ENABLED
              value: "true"
            - name: QDRANT__CLUSTER__P2P__PORT
              value: "6335"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - containerPort: {{ .Values.qdrant.grpcPort }}
              name: grpc
            - containerPort: {{ .Values.qdrant.httpPort }}
              name: http
            - containerPort: 6335
              name: p2p
          volumeMounts:
            - name: data
              mountPath: /qdrant/storage
          resources: {{ toYaml .Values.resources.qdrant | nindent 12 }}
          startupProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.qdrant.httpPort }}
            failureThreshold: 30
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.qdrant.httpPort }}
            initialDelaySeconds: 0
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [{{ .Values.persistence.qdrant.accessMode }}]
        {{- if .Values.persistence.qdrant.storageClass }}
        storageClassName: {{ .Values.persistence.qdrant.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.qdrant.size }}

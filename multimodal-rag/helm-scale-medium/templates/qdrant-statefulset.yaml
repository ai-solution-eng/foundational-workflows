apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.deployment.name }}-qdrant
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.deployment.name }}-qdrant
spec:
  serviceName: {{ .Values.deployment.name }}-qdrant
  replicas: {{ .Values.qdrant.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.deployment.name }}-qdrant
  template:
    metadata:
      # EzUA app-catalog labels on the POD TEMPLATE: the catalog derives a
      # card's status from labeled pods — an app whose pods carry no
      # hpe-ezua labels shows "Unknown" in the catalog (this chart was the
      # only unlabeled-pod app on G2 and the only Unknown card, 2026-10).
      # Long-running controllers only: cron-job pods stay UNLABELED — the
      # platform's assign-custom-scheduler-for-ezua-user-vendor-pods policy
      # stamps schedulerName on labeled pods at EVERY admission, and pod
      # updates (Job finalizer removal) then reject the immutable-field
      # change — the G2 2026-09-24 undeletable-cron-pod incident (see
      # tests/full_pipeline/test_kyverno_vendor_labels_render.py).
      labels:
        app: {{ .Values.deployment.name }}-qdrant
        hpe-ezua/type: vendor-service
        hpe-ezua/app: {{ .Chart.Name }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: qdrant
          image: "{{ .Values.qdrant.image.repository }}:{{ .Values.qdrant.image.tag }}"
          imagePullPolicy: {{ .Values.qdrant.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          command:
            - /bin/sh
            - -c
            - |
              ORDINAL="${POD_NAME##*-}"
              SVC="{{ .Values.deployment.name }}-qdrant"
              if [ "$ORDINAL" = "0" ]; then
                echo "Starting first Qdrant peer (bootstraps new cluster)"
                exec /qdrant/qdrant --uri "http://${POD_NAME}.${SVC}:6335/"
              else
                echo "Joining existing Qdrant cluster via ${SVC}-0"
                exec /qdrant/qdrant --bootstrap "http://${SVC}-0.${SVC}:6335/" --uri "http://${POD_NAME}.${SVC}:6335/"
              fi
          env:
            - name: QDRANT__CLUSTER__ENABLED
              value: "true"
            - name: QDRANT__CLUSTER__P2P__PORT
              value: "6335"
            - name: QDRANT__TELEMETRY__DETAIL_LEVEL
              value: "full"
            {{- if .Values.qdrant.telemetryDisabled }}
            # telemetry.qdrant.io is unreachable from in-cluster qdrant
            # (no egress) — hourly ERROR spam otherwise (721 in 9 days).
            - name: QDRANT__TELEMETRY_DISABLED
              value: "true"
            {{- end }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - containerPort: {{ .Values.qdrant.grpcPort }}
              name: grpc
            - containerPort: {{ .Values.qdrant.httpPort }}
              name: http
            - containerPort: 6335
              name: p2p
          volumeMounts:
            - name: data
              mountPath: /qdrant/storage
          resources: {{ toYaml .Values.resources.qdrant | nindent 12 }}
          startupProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.qdrant.httpPort }}
            failureThreshold: 30
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.qdrant.httpPort }}
            initialDelaySeconds: 0
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [{{ .Values.persistence.qdrant.accessMode }}]
        {{- if .Values.persistence.qdrant.storageClass }}
        storageClassName: {{ .Values.persistence.qdrant.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.qdrant.size }}

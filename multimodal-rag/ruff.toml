# Ruff configuration for the multimodal-rag project.
# Aligns ruff with the existing black (line-length 120) + flake8 setup.
#
# The rules ignored below are deliberate, code-wide patterns that are risky or
# undesirable to refactor.  Everything else is fixed in-code.

line-length = 120
target-version = "py312"
output-format = "full"

[lint]
# E402 is not in ruff's default; add it to preserve the coverage flake8 provided
# (intentional late imports are suppressed with `# noqa: E402`).
extend-select = ["E402"]

# The rules ignored below are deliberate, code-wide patterns that are risky or
# undesirable to refactor.  Everything else is fixed in-code.
ignore = [
    "BLE001",  # Broad `except Exception` is used everywhere as a resilience/fallback pattern.
    "B008",    # FastAPI dependency-injection idiom: `Body(...)`, `File(...)`, `Header(...)` in argument defaults.
    "ASYNC230",  # Intentional blocking file reads inside async funcs (uploads / embedding input loading).
    "SIM115",  # `NamedTemporaryFile(delete=False)` is handed off to subprocesses / other owners on purpose.
    "B023",    # Closures that reference loop variables; refactoring risks behaviour changes.
    "DTZ005",  # Naive `datetime.now()` used for display/isoformat metadata on purpose.
    "DTZ006",  # Naive `datetime.fromtimestamp()` used for display on purpose.
    "S110",    # Best-effort `try/except/pass` (e.g. cache writes that may silently fall back).
    "S112",    # Best-effort `try/except/continue` (e.g. skipping unreachable Qdrant points).
    "PLW1510",  # Fire-and-forget `subprocess.run` calls; errors handled via try/except or returncode checks.
]

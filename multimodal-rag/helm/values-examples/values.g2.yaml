# =============================================================================
# Multimodal RAG — SE G2 deployment values (sanitized) — single-replica chart.
#
# Variant: helm/  (chart rag-mcp-server, 1 API replica + MCP sidecar, 1 Qdrant)
# Choose this variant for pilots and single-team use — smallest footprint.
# For concurrent multi-user throughput use helm-scale-medium/ or
# helm-scale-large/ instead (more API replicas + sharded Qdrant).
#
# Sanitized SE-G2 deployment: real (non-secret) serving URLs and the real
# cluster domain are kept; ALL credentials are fillers. This folder is
# hardlinked to the public delivery repo — never put real credentials here.
# Real per-site values live in helm/local/ (gitignored + hardlink-ignored +
# never packaged).
#
# PCAI usage: import the packaged chart once, paste this whole file into the
# release's Helm Values editor, adjust the '# SITE:' lines, apply.
# Operators with cluster access may render-check first:
#   helm template <release> helm/ -f helm/values-examples/values.g2.yaml
# =============================================================================

# -- Deployment -----------------------------------------------------------------
replicaCount: 1

image:
  # Packaged with the chart — leave as-is unless you built your own image.
  # (Kept in lockstep with the chart version by ./bump_version.sh.)
  repository: ghcr.io/ai-solution-eng/multimodal-rag-mcp
  tag: v4.4.1
  pullPolicy: IfNotPresent

deployment:
  name: rag-mcp-server
  appName: rag-mcp-server

# -- Persistence ------------------------------------------------------------------
persistence:
  data:
    # SITE: size to the corpus (RWX storage class required)
    size: 50Gi
    storageClass: gl4f-filesystem
    accessMode: ReadWriteMany
  qdrant:
    # SITE: size to the corpus
    size: 50Gi
    storageClass: gl4f-filesystem
    accessMode: ReadWriteMany
    mountReadOnly: true

# -- Model configuration -------------------------------------------------------------
# The embedder is the only required endpoint; leave url "" to disable a role.
models:
  embedder:
    name: RamManavalan/Qwen3-VL-Embedding-8B-FP8
    # SITE: SE-G2 shared serving endpoints (public URLs, not secret)
    url: https://qwen3-vl-embedding-8b.project-user-andrew-bydlon.serving.pcai-se-ai-application.hst.rdlabs.hpecorp.net
    className: MultiModalEmbeddings
    extra:
      embedding_dim: 4096
      chunk_size: 2048
      chunk_overlap: 256
      code_chunk_size: 8192
      code_chunk_overlap: 512
      tokenizer_name: Qwen/Qwen3-VL-Embedding-8B
      tokenizer_type: HuggingFace
      # Same-embedder alias for the dataset fingerprint guard: datasets indexed
      # under this id keep working after the FP8 swap (vectors agree to >=0.95 cosine).
      # Requires an image with alias support — v4.0.0 rejects unknown extra keys.
      alias: Qwen/Qwen3-VL-Embedding-8B
  reranker:
    name: Qwen/Qwen3-VL-Reranker-8B
    # SITE: optional — precision at the cost of latency
    url: https://qwen3-vl-reranker-8b.project-user-andrew-bydlon.serving.pcai-se-ai-application.hst.rdlabs.hpecorp.net
    className: MultiModalReranker
    extra: {}
  vlm:
    name: Qwen/Qwen3.8-27B-FP8
    # SITE: optional — captions images/videos, converts them at query time
    url: https://qwen-38-27b.project-user-andrew-bydlon.serving.pcai-se-ai-application.hst.rdlabs.hpecorp.net
    extra: {}
  asr:
    name: CohereLabs/cohere-transcribe-03-2026
    # SITE: optional — transcribes audio + video soundtracks
    url: https://cohere-transcribe-03-2026.project-user-andrew-bydlon.serving.pcai-se-ai-application.hst.rdlabs.hpecorp.net
    extra: {}

# -- Model API keys (sensitive — fillers here) -----------------------------------------
# Rendered into the <name>-model-keys Secret (env MODEL_*_API_KEY).
# SE G2: platform JWTs for the serving endpoints — kept ONLY in helm/local/.
modelSecrets:
  # SITE: paste the real platform JWT for each endpoint you enabled
  embedderApiKey: "<EMBEDDER_API_KEY>"
  rerankerApiKey: "<RERANKER_API_KEY>"
  vlmApiKey: "<VLM_API_KEY>"
  asrApiKey: "<ASR_API_KEY>"

# -- S3 / MinIO ---------------------------------------------------------------------------
# Endpoint URL is non-sensitive (ConfigMap); access keys go into the Secret.
s3:
  endpointUrl: http://minio.minio.svc.cluster.local:9000
  # SITE: fill only if the site's MinIO needs static keys (else leave "" for
  # the default boto3 credential chain)
  accessKeyId: ""
  secretAccessKey: ""

# -- RAG parameters ---------------------------------------------------------------------------
rag:
  ocr: false
  captionWithAsr: true
  captionWithVlm: true
  # Keep false on SE G2: URLs containing ".serving." are rewritten to their
  # in-cluster .svc.cluster.local form.
  remote: false
  dedupThreshold: 0.995
  # Ingest-time contextual retrieval (RAG_CONTEXTUAL_DEFAULT) — COMMENTED /
  # off. The per-dataset checkbox on each dataset's page is the recommended
  # path (blast radius = one dataset); enabling THIS deploy default stamps
  # every NEW dataset contextual:true; cost = one small LLM call per
  # real-text chunk at ingest (check
  # POST /api/admin/datasets/{name}/contextual-preview first); existing
  # datasets are untouched (PATCH or Recreate to adopt). To enable:
  # contextual: true
  contextual: false

  # Weighted-RRF per-dataset create-time defaults (RAG_RRF_DEFAULT) —
  # present but DISABLED on purpose: a global non-neutral default silently
  # shifts EVERY new dataset's ranking. The showcase path is per-dataset:
  # set the weights per dataset from the home page's dataset-defaults
  # editor (or pass sparse_weight/dense_weight per search call). When you
  # do want a deploy-wide default, enable and set sparse_weight > dense
  # for code/log-heavy corpora (weights are rank-space tilts, not score
  # multipliers — trust the order, not the magnitude):
  rrfDefault:
    enabled: false
    dense: 1.0
    sparse: 1.0
    k: 2
    # Example (mild sparse tilt for code/log corpora — uncomment to apply):
    #   enabled: true
    #   dense: 1.0
    #   sparse: 1.5
    #   k: 2

  # Unlock TTL bound (RAG_UNLOCK_MAX_TTL): caps explicit unlock TTLs on both
  # surfaces.  0 = this deployment opts into NO-EXPIRY unlocks: the /access
  # page's "No expiry (0)" option is selectable (a lease lasts until an
  # explicit Lock — practical for a personal memory dataset), and MCP
  # unlock_dataset(ttl=0) is accepted (lease lasts until pod restart).
  unlockMaxTtl: 0
# -- Qdrant --------------------------------------------------------------------------------------
# Single-replica chart: Qdrant runs as one StatefulSet; the API mounts its
# PVC read-only (mountReadOnly above) to report disk usage.
qdrant:
  image:
    repository: qdrant/qdrant
    tag: v1.19.0
    pullPolicy: IfNotPresent
  grpcPort: 6334
  httpPort: 6333
  telemetryDisabled: true

# -- MCP server (sidecar) --------------------------------------------------------------------------
mcp:
  apiKey:
    # SITE: pre-create the Secret before applying — the chart never creates
    # or inlines this key:
    #   kubectl -n <ns> create secret generic mcp-fleet-apikeys \
    #     --from-literal='api-keys=<key1>,<key2>'
    existingSecret: "mcp-fleet-apikeys"
    existingSecretKey: "api-keys"
  # D15 per-user registry keys + dataset ACLs — KEY MATERIAL (provide from a
  # Secret pipeline, never commit). Empty on this site: per-user keys are
  # minted on the /access page (D17 overlay) instead.
  apiKeyClients: ""
  datasetAcls: ""

  enabled: true
  port: 9090

# -- Service configuration -----------------------------------------------------------------------------
service:
  api:
    type: ClusterIP
    port: 80
  mcp:
    type: ClusterIP

# -- Resources ---------------------------------------------------------------------------------------------
# SITE: tune to the namespace quota
resources:
  app:
    requests:
      memory: 2Gi
      cpu: 2
    limits:
      memory: 8Gi
      cpu: 4
  qdrant:
    requests:
      memory: 16Gi
      cpu: '4'
    limits:
      memory: 32Gi
      cpu: '8'

extraEnv: {}

# -- Security hardening ------------------------------------------------------------------------------------------
# mediaTokenSecret is REQUIRED: both the API and MCP containers refuse to
# start without it. Generate: python -c "import secrets; print(secrets.token_hex(32))"
security:
  # SITE (P0-7): key material lives in a Secret YOU manage — the chart
  # renders neither RAG_API_KEY nor MEDIA_TOKEN_SECRET into its own Secret
  # when existingSecret is set; both containers read them via secretKeyRef.
  # Your Secret must carry BOTH keys (the containers refuse to start
  # without MEDIA_TOKEN_SECRET):
  #   kubectl -n <ns> create secret generic rag-platform-keys   #     --from-literal=RAG_API_KEY='<deployment key>'   #     --from-literal=MEDIA_TOKEN_SECRET='<64-hex secret>'
  # Rotation = update your Secret + roll the pods (env binds at pod start).
  existingSecret: "rag-platform-keys"
  existingSecretApiKey: RAG_API_KEY
  existingSecretMediaTokenKey: MEDIA_TOKEN_SECRET
  mediaTokenTtl: 3600
  ingestAllowHosts: ''
  blockPrivateHosts: true
  maxDownloadBytes: 536870912
  archiveMaxTotalBytes: 2147483648
  archiveMaxMemberBytes: 1073741824
  archiveMaxEntries: 10000
  mediaAllowPathPrefixes: /data/datasets:/data/staging
  pwMaxFailures: 10
  pwFailWindow: 300
  # true is correct on SE G2 / hosted trials: an enforcing auth proxy
  # (oauth2-proxy) overwrites the identity headers on every request.
  trustProxyIdentity: true

  # Self-service dataset selection + per-user key minting (decisions D16/D17,
  # env RAG_ACCESS_STORE).  true ON THIS SITE: the /access page gets the
  # admin "User keys" panel (mint per-user keys, set dataset grants, rotate,
  # revoke — all from the browser, applied on the next request) and every
  # registry key gets the checkbox model (all dataset names visible for
  # discovery; protected ones demand their password once — saved per identity
  # under /data/access; ★ memory binding server-side so opencode needs only
  # the API key).  Per-user keys come from mcp.apiKeyClients (env registry)
  # or are minted on the page (file overlay) — both merge.
  accessStore: true
  # Datasets that can never be self-selected (comma-separated; renders only
  # when non-empty). Empty = everything selectable with proof.
  accessDenySelect: ''
  # Deployment-wide fallback memory dataset (RAG_MEMORY_DEFAULT) for callers
  # without a personal ★ binding. Empty = unset.
  memoryDefault: ''
  # REST/MCP key + media-token HMAC secret — empty here because
  # security.existingSecret above supplies both (set these ONLY as a
  # back-compat alternative when no Secret is managed).
  apiKey: ''
  mediaTokenSecret: ''
  # Gate /metrics behind an API key (env RAG_METRICS_AUTH) — keep false here:
  # in-cluster Prometheus scrapes the exposition without a token. When true,
  # the ServiceMonitor needs a bearer Secret (metrics.serviceMonitorBearerSecret).
  metricsAuth: false

# -- Redis (unused by the single-replica chart; kept for template uniformity) ---------------------------------------
redis:
  enabled: false
  password: ''

# -- Metrics (optional) -----------------------------------------------------------------------------------------------
metrics:
  serviceMonitor: false
  interval: 30s
  # When security.metricsAuth is on, name a Secret whose <key> holds a valid
  # API key; the ServiceMonitor presents it as the scrape bearer token.
  serviceMonitorBearerSecret: ''
  serviceMonitorBearerSecretKey: RAG_API_KEY

# -- Backups (optional) ---------------------------------------------------------------------------------------------------
backups:
  enabled: false
  schedule: 0 3 * * *
  bucket: ''
  retentionDays: 0

# -- Watched S3 sources (COMMENTED — enable if trivial for the demo) ------------------------------------------------
# Reconciler CronJob: every tick, POST each source's s3:// prefixes to
# /api/datasets/{dataset}/batch-urls with sync=true — new/changed objects are
# ingested, objects deleted upstream are pruned, unchanged objects are skipped
# via the per-dataset ETag/Size state (files/.watched_state.json).  Prefixes
# must be s3:// directory URLs (validated at render time).  The CronJob
# presents X-RAG-Api-Key from the <name>-model-keys Secret (envFrom) — the
# API-key requirement is already handled by this chart's Secret wiring.
# SITE: the bucket/prefix names below are PLAUSIBLE DEFAULTS — point them at
# a prefix the G2 MinIO (s3.endpointUrl above) actually holds.  Flip
# enabled: true to demo "drop a file in S3, it appears in the dataset"; turn
# it off again with enabled: false (renders nothing).
watchedSources:
  enabled: false
  schedule: '*/15 * * * *'
  sources: []
  # sources:
  #   - dataset: showcase-docs
  #     prefixes:
  #       - s3://mlis-models/showcase-docs/      # SITE: change me — bucket/prefix your S3 holds

# -- PCAI (HPE Ezmeral Unified Analytics) integration -----------------------------------------------------------------------
ezua:
  enabled: true
  virtualService:
    # SITE: SE-G2 cluster domain (literal — or use rag-mcp-server.${DOMAIN_NAME})
    endpoint: rag-mcp-server.pcai-se-ai-application.hst.rdlabs.hpecorp.net
    istioGateway: istio-system/ezaf-gateway
    timeout: 300s
    longTimeout: 3600s
  authorizationPolicy:
    # SITE: false on SE G2 — the ezaf-gateway applies HPE SSO centrally, so the
    # chart does not create its own AuthorizationPolicy. Set true (+ provider
    # oauth2-proxy) on customer PCAI clusters.
    enabled: false
    namespace: istio-system
    providerName: oauth2-proxy
